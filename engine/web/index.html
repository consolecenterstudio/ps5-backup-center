<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PS5 Backup Center</title>
  <link rel="icon" href="logo.png">
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo" aria-hidden="true"></span><span>PS5 Backup Center</span></div>
  <nav class="tabs" id="tabs">
    <button data-tab="home" class="active" data-i18n>Accueil</button>
    <button data-tab="library" data-i18n>Bibliothèque</button>
    <button data-tab="saves" data-i18n>Parties</button>
    <button data-tab="backups" data-i18n>Sauvegardes</button>
    <button data-tab="synchro" data-i18n>Synchro</button>
    <button data-tab="transfers" data-i18n>Transferts</button>
    <button data-tab="devices" data-i18n>Appareils</button>
    <button data-tab="tasks"><span data-i18n>Tâches</span> <span class="count" id="tasks-count"></span></button>
  </nav>
  <div class="engine" id="engine-state" title="État du moteur" data-i18n-title><span class="dot"></span><span class="label" data-i18n>Connexion…</span></div>
  <button class="gear" id="search-btn" type="button" title="Rechercher ( / )" aria-label="Rechercher" data-i18n-title data-i18n-aria-label><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4.2-4.2"/></svg></button>
  <button class="gear" data-tab="settings" id="gear" title="Paramètres" aria-label="Paramètres" data-i18n-title data-i18n-aria-label><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
</header>

<main id="view"><div class="loading"><span class="spinner"></span><span data-i18n>Chargement de votre collection…</span></div></main>

<div class="sheet hidden" id="sheet" role="dialog" aria-modal="true"><div class="panel" id="sheet-panel"></div></div>

<section class="pair hidden" id="pair">
  <div class="pair-card">
    <span class="logo big" aria-hidden="true"></span>
    <h1 data-i18n>Associer cet appareil</h1>
    <p><span data-i18n>Saisissez le code à 6 chiffres affiché sur la télé dans</span> <b data-i18n>Paramètres → Appareils</b></p>
    <input id="pair-code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000 000">
    <input id="pair-name" maxlength="40" placeholder="Nom de cet appareil (facultatif)" data-i18n-placeholder>
    <button class="primary" id="pair-go" data-i18n>Associer</button>
    <p class="error" id="pair-error"></p>
  </div>
</section>

<div class="toast hidden" id="toast"></div>
<script src="/i18n.js"></script>
<script src="/manage.js"></script>
</body>
</html>
