be se usa como un NAS (copias, destino, sincro); sus claves se pegan desde el móvil con un código QR.", "NAS en WebDAV (Synology, QNAP, Nextcloud…) à côté de FTP et SMB ; le certificat maison du NAS est accepté une fois puis retenu.": "NAS por WebDAV (Synology, QNAP, Nextcloud…) junto a FTP y SMB; el certificado propio del NAS se acepta una vez y queda recordado.", "« Utilisé pour » : chaque NAS sert aux sauvegardes, à la synchro, ou aux deux ; plusieurs synchros possibles avec le même NAS, chacune dans son dossier.": "«Usado para»: cada NAS sirve para las copias, la sincro o ambas; varias sincros posibles con el mismo NAS, cada una en su carpeta.", "Tâches : « Voir la sauvegarde », mettre une sauvegarde à la corbeille, cocher plusieurs tâches.": "Tareas: «Ver la copia», enviar una copia a la papelera, marcar varias tareas.", "Communauté : « Messages de la communauté », « Laisser un message » et « Suivez-nous » (X, YouTube, Reddit) ; Projets à financer : PS5 Center et sa jauge.": "Comunidad: «Mensajes de la comunidad», «Dejar un mensaje» y «Síguenos» (X, YouTube, Reddit); Proyectos por financiar: PS5 Center y su barra de progreso.", "Clavier complet : caractères spéciaux (R1), majuscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "Teclado completo: caracteres especiales (R1), mayúsculas (L1), é è à ç; cada botón muestra su botón del mando.", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "NAS por WebDAV mucho más rápido; un mismo NAS añadido por dos protocolos solo cuenta una vez, y sus copias indican por cuál pasan.", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "Inicio: una sola tarjeta Sincro que pasa por cada dispositivo; «Partidas disponibles» solo nombra los lugares que de verdad tienen alguna.", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "Biblioteca: toda la fila de filtros cabe en pantalla; otra consola se ve de un vistazo, con nombres claros («Todos sus juegos», «No están aquí», «También aquí»).", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "Partidas: la Papelera siempre está visible, la tarjeta «Interno» aparece cuando hay copias y se pueden eliminar varios elementos marcados.", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "Informar de un problema: tres tarjetas claras (un fallo, una pregunta, una estrella) con su código; Ajustes reordenados.", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "Nuevas imágenes de dispositivos (Nube, FTP / SMB) a la misma altura que las demás; nuestro logo en la tarjeta «Actualización».", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "Restaurar desde un NAS: una copia completa pasa por la restauración guiada.", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS: ya no aparece la carpeta «PBC Backup/PBC Backup»; en la raíz de un Synology, la prueba pide elegir una carpeta compartida.", "Sauvegardes : la liste des endroits ne se répète plus sous chaque jeu ; une copie mise à la corbeille disparaît tout de suite.": "Partidas: la lista de lugares ya no se repite bajo cada juego; una copia enviada a la papelera desaparece al instante.", "Mises à jour : un fichier qui échoue est réessayé une fois ; une version installée mais pas encore active est bien indiquée.": "Actualizaciones: un archivo que falla se reintenta una vez; una versión instalada pero aún no activa se indica e mise à jour.": "Google Drive, OneDrive und Dropbox: Jeder verbindet sein eigenes Konto vom Handy aus (QR-Code, Anmeldung beim Dienst), ohne etwas auf der PS5 einzutippen; die App hat nur Zugriff auf ihren eigenen Ordner. Freischaltung mit einem kommenden Update.", "Un stockage dans le nuage s'utilise comme un NAS (sauvegardes, destination, synchro) ; ses clés se collent depuis le téléphone grâce à un code QR.": "Ein Cloud-Speicher wird wie ein NAS genutzt (Sicherungen, Ziel, Sync); seine Schlüssel werden per QR-Code vom Handy eingefügt.", "NAS en WebDAV (Synology, QNAP, Nextcloud…) à côté de FTP et SMB ; le certificat maison du NAS est accepté une fois puis retenu.": "NAS per WebDAV (Synology, QNAP, Nextcloud…) neben FTP und SMB; das selbstsignierte Zertifikat des NAS wird einmal akzeptiert und dann gespeichert.", "« Utilisé pour » : chaque NAS sert aux sauvegardes, à la synchro, ou aux deux ; plusieurs synchros possibles avec le même NAS, chacune dans son dossier.": "„Verwendet für“: Jedes NAS dient für Sicherungen, Sync oder beides; mehrere Syncs mit demselben NAS sind möglich, jeder in seinem eigenen Ordner.", "Tâches : « Voir la sauvegarde », mettre une sauvegarde à la corbeille, cocher plusieurs tâches.": "Aufgaben: „Sicherung ansehen“, eine Sicherung in den Papierkorb legen, mehrere Aufgaben markieren.", "Communauté : « Messages de la communauté », « Laisser un message » et « Suivez-nous » (X, YouTube, Reddit) ; Projets à financer : PS5 Center et sa jauge.": "Community: „Nachrichten der Community“, „Nachricht hinterlassen“ und „Folge uns“ (X, YouTube, Reddit); Projekte zum Finanzieren: PS5 Center und sein Fortschrittsbalken.", "Clavier complet : caractères spéciaux (R1), majuscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "Vollständige Tastatur: Sonderzeichen (R1), Großbuchstaben (L1), é è à ç; jede Schaltfläche zeigt ihre Controller-Taste.", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "NAS per WebDAV deutlich schneller; ein über zwei Protokolle hinzugefügtes NAS zählt nur einmal, und seine Kopien zeigen ihren Weg an.", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "Start: eine einzige Sync-Karte, die durch alle Geräte blättert; „Verfügbare Spielstände“ nennt nur die Orte, die wirklich welche haben.", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "Bibliothek: die ganze Filterleiste passt auf den Bildschirm; eine andere Konsole ist auf einen Blick zu sehen, mit klaren Namen („Alle ihre Spiele“, „Fehlen hier“, „Auch hier“).", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "Spielstände: der Papierkorb ist immer sichtbar, die Karte „Intern“ erscheint, sobald es Kopien gibt, und mehrere markierte Elemente lassen sich löschen.", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "Problem melden: drei klare Karten (ein Fehler, eine Frage, ein Stern) mit ihrem Code; Einstellungen neu sortiert.", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "Neue Gerätebilder (Cloud, FTP / SMB) in derselben Höhe wie die anderen; unser Logo auf der Karte „Update“.", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "Wiederherstellen von einem NAS: eine vollständige Sicherung läuft über die geführte Wiederherstellung.", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS: kein Ordner „PBC Backup/PBC Backup“ mehr; im Stammverzeichnis eine  caratteri speciali (R1), maiuscole (L1), é è à ç; ogni pulsante mostra il suo tasto del controller.", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "NAS via WebDAV molto più veloce; uno stesso NAS aggiunto con due protocolli conta una sola volta, e le sue copie indicano la via usata.", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "Home: un'unica scheda Sincro che scorre ogni dispositivo; «Salvataggi disponibili» nomina solo i posti che ne hanno davvero.", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "Libreria: tutta la riga dei filtri sta sullo schermo; un'altra console si vede a colpo d'occhio, con nomi chiari («Tutti i suoi giochi», «Mancano qui», «Anche qui»).", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "Salvataggi: il Cestino è sempre visibile, la scheda «Interno» compare quando ci sono copie, si possono eliminare più elementi selezionati.", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "Segnala un problema: tre schede chiare (un bug, una domanda, una stella) con il loro codice; Impostazioni riordinate.", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "Nuove immagini dei dispositivi (Cloud, FTP / SMB) alla stessa altezza delle altre; il nostro logo sulla scheda «Aggiornamento».", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "Ripristino da un NAS: un backup completo passa dal ripristino guidato.", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS: niente più cartella «PBC Backup/PBC Backup»; alla radice di un Synology, il test chiede di scegliere una cartella condivisa.", "Sauvegardes : la liste des endroits ne se répète plus sous chaque jeu ; une copie mise à la corbeille disparaît tout de suite.": "Salvataggi: l'elenco dei posti non si ripete più sotto ogni gioco; una copia spostata nel cestino sparisce subito.", "Mises à jour : un fichier qui échoue est réessayé une fois ; une version installée mais pas encore active est bien indiquée.": "Aggiornamenti: un file che non riesce viene ritentato una volta; una versione installata ma non ancora attiva è indicata correttamente.", "Petits défauts d'affichage corrigés : textes coupés, codes QR de tailles différentes, étiquettes qui se chevauchaient.": "Piccoli difetti di visualizzazione corretti: testi tagliati, codici QR di dimensioni diverse, etichette sovrapposte.", "Bêta": "Beta", "Canal bêta": "Canale beta", "Stable (recommandé)": "Stabile (consigliato)", "Canal des mises à jour": "Canale degli aggiornamenti", "Quoi de neuf": "Novità", "Nouveau": "Nuovo", "Améliorations": "Miglioramenti", "Corrections": "Correzioni", "Toutes les versions": "Tutte le versioni", "Signaler un problème": "Segnala un problema", "Suivez-nous": "Seguici", "Soutenir le projet": "Sostieni il progetto", "Revenir à la version précédente": "Tornare alla versione precedente", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Le beta arrivano prima delle versioni stabili, per provarle. Possono contenere difetti; «Torna alla versione precedente» resta disponibile. Torna a Stabile quando vuoi.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Impostazioni › Aggiornamenti › Canale degli aggiornamenti: Stabile (consigliato, predefinito) o Beta. Con Beta, le versioni di prova arrivano prima di quelle stabili, segnate «beta» in Versioni disponibili; «Torna alla versione precedente» resta disponibile.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Una beta non viene mai pubblicata come versione GitHub: Prospero Store e gli altri cataloghi offrono solo versioni stabili.", "Installer": "Installa", "Téléchargez PPSA99950.zip ci-dessous et décompressez-le : vous obtenez un dossier PPSA99950.": "Scarica PPSA99950.zip qui sotto ed estrailo: otterrai una cartella PPSA99950.", "Copiez-le dans /data/homebrew/ sur votre PS5 (FTP ou USB).": "Copiala in /data/homebrew/ sulla tua PS5 (FTP o USB).", "Ouvrez PS5 Backup Center depuis votre lanceur homebrew. L'appli démarre son propre moteur.": "Apri PS5 Backup Center dal tuo launcher homebrew. L'app avvia il proprio motore.", "Facultatif : {elf} démarre le moteur seul depuis un chargeur d'ELF (port 9021).": "Facoltativo: {elf} avvia solo il motore da un loader ELF (porta 9021).", "Il faut une PS5 qui lance déjà des applis homebrew. Déjà installée ? Passez simplement au canal Bêta dans l'appli.": "Serve una PS5 che esegua già app homebrew. Già installata? Basta passare al canale Beta nell'app.", "Fichiers": "File", "Sommes de contrôle (SHA-256)": "Checksum (SHA-256)"}, "nl": {"PS5 Backup Center 3": "PS5 Backup Center 3", "Stockage dans le nuage (Appareils › Nuage) : Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 ou tout autre service S3, choisis par leur nom ; l'adresse se remplit toute seule.": "Cloudopslag (Apparaten › Cloud): Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 of elke andere S3-dienst, te kiezen op naam; het adres vult zichzelf in.", "pCloud, Koofr et Nextcloud en WebDAV, préréglés.": "pCloud, Koofr en Nextcloud via WebDAV, vooraf ingesteld.", "Google Drive, OneDrive et Dropbox : chacun connecte son propre compte depuis son téléphone (code QR, connexion chez le service), sans rien taper sur la PS5 ; l'appli n'a accès qu'à son propre dossier. Activation dans une prochaine mise à jour.": "Google Drive, OneDrive en Dropbox: iedereen koppelt zijn eigen account vanaf zijn telefoon (QR-code, inloggen bij de dienst), zonder iets te typen op de PS5; de app heeft alleen toegang tot zijn eigen map. Inschakeling in een volgende update.", "Un stockage dans le nuage s'utilise comme un NAS (sauvegardes, destination, synchro) ; ses clés se collent depuis le téléphone grâce à un code QR.": "Cloudopslag werkt net als een NAS (back-ups, bestemming, sync); de sleutels plak je vanaf je telefoon met een QR-code.", "NAS en WebDAV (Synology, QNAP, Nextcloud…) à côté de FTP et SMB ; le certificat maison du NAS est accepté une fois puis retenu.": "NAS via WebDAV (Synology, QNAP, Nextcloud…) naast FTP en SMB; het eigen certificaat van de NAS wordt één keer geaccepteerd en daarna onthouden.", "« Utilisé pour » : chaque NAS sert aux sauvegardes, à la synchro, ou aux deux ; plusieurs synchros possibles avec le même NAS, chacune dans son dossier.": "„Gebruikt voor”: elke NAS dient voor back-ups, sync of allebei; meerdere syncs met dezelfde NAS zijn mogelijk, elk in een eigen map.", "Tâches : « Voir la sauvegarde », mettre une sauvegarde à la corbeille, cocher plusieurs tâches.": "Taken: „Back-up bekijken”, een back-up naar de prullenbak verplaatsen, meerdere taken aanvinken.", "Communauté : « Messages de la communauté », « Laisser un message » et « Suivez-nous » (X, YouTube, Reddit) ; Projets à financer : PS5 Center et sa jauge.": "Community: „Berichten van de community”, „Laat een bericht achter” en „Volg ons” (X, YouTube, Reddit); Projecten om te financieren: PS5 Center en zijn voortgangsbalk.", "Clavier complet : caractères spéciaux (R1), majuscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "Volledig toetsenbord: speciale tekens (R1), hoofdletters (L1), é è à ç; elke knop toont zijn controllerknop.", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "NAS via WebDAV veel sneller; dezelfde NAS die via twee protocollen is toegevoegd telt maar één keer, en de kopieën tonen via welke ze lopen.", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "Start: één Sync-kaart die langs elk apparaat bladert; „Beschikbare saves” noemt alleen de plekken die er echt hebben.", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "Bibliotheek: de hele rij filters past op het scherm; een andere console zie je in één oogopslag, met duidelijke namen („Al haar games”, „Ontbreken hier”, „Ook hier”).", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "Saves: de Prullenbak is altijd zichtbaar, de kaart „Intern” verschijnt zodra er kopieën zijn, en meerdere aangevinkte items kunnen worden verwijderd.", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "Een probleem melden: drie duidelijke kaarten (een bug, een vraag, een ster) met hun code; Instellingen opnieuw geordend.", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "Nieuwe apparaatafbeeldingen (Cloud, FTP / SMB) even hoog als de andere; ons logo op de kaart „Update”.", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "Herstellen vanaf ur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Instellingen › Updates › Updatekanaal: Stabiel (aanbevolen, standaard) of Bèta. Op Bèta komen testversies vóór de stabiele, gemarkeerd als ‘bèta’ in Beschikbare versies; ‘Terug naar de vorige versie’ blijft mogelijk.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Een bèta wordt nooit als GitHub-release gepubliceerd: Prospero Store en andere catalogi bieden alleen stabiele versies aan.", "Installer": "Installeren", "Téléchargez PPSA99950.zip ci-dessous et décompressez-le : vous obtenez un dossier PPSA99950.": "Download PPSA99950.zip hieronder en pak het uit: je krijgt een map PPSA99950.", "Copiez-le dans /data/homebrew/ sur votre PS5 (FTP ou USB).": "Kopieer die naar /data/homebrew/ op je PS5 (FTP of USB).", "Ouvrez PS5 Backup Center depuis votre lanceur homebrew. L'appli démarre son propre moteur.": "Open PS5 Backup Center vanuit je homebrew-launcher. De app start zijn eigen engine.", "Facultatif : {elf} démarre le moteur seul depuis un chargeur d'ELF (port 9021).": "Optioneel: {elf} start alleen de engine vanuit een ELF-loader (poort 9021).", "Il faut une PS5 qui lance déjà des applis homebrew. Déjà installée ? Passez simplement au canal Bêta dans l'appli.": "Vereist een PS5 die al homebrew-apps draait. Al geïnstalleerd? Schakel in de app gewoon over naar het bètakanaal.", "Fichiers": "Bestanden", "Sommes de contrôle (SHA-256)": "Controlesommen (SHA-256)"}, "pl": {"PS5 Backup Center 3": "PS5 Backup Center 3", "Stockage dans le nuage (Appareils › Nuage) : Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 ou tout autre service S3, choisis par leur nom ; l'adresse se remplit toute seule.": "Przechowywanie w chmurze (Urządzenia › Chmura): Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 lub dowolna inna usługa S3, wybierane z nazwy; adres uzupełnia się sam.", "pCloud, Koofr et Nextcloud en WebDAV, préréglés.": "pCloud, Koofr i Nextcloud przez WebDAV, wstępnie skonfigurowane.", "Google Drive, OneDrive et Dropbox : chacun connecte son propre compte depuis son téléphone (code QR, connexion chez le service), sans rien taper sur la PS5 ; l'appli n'a accès qu'à son propre dossier. Activation dans une prochaine mise à jour.": "Google Drive, OneDrive i Dropbox: każdy łączy własne konto z telefonu (kod QR, logowanie w usłudze), bez wpisywania czegokolwiek na PS5; aplikacja ma dostęp tylko do własnego folderu. Włączenie w jednej z kolejnych aktualizacji.", "Un stockage dans le nuage s'utilise comme un NAS (sauvegardes, destination, synchro) ; ses clés se collent depuis le téléphone grâce à un code QR.": "Chmura działa jak NAS (kopie, miejsce docelowe, synchro); jej klucze wkleja się z telefonu za pomocą kodu QR.", "NAS en WebDAV (Synology, QNAP, Nextcloud…) à côté de FTP et SMB ; le certificat maison du NAS est accepté une fois puis retenu.": "NAS przez WebDAV (Synology, QNAP, Nextcloud…) obok FTP i SMB; własny certyfikat NAS-a jest akceptowany raz, a potem zapamiętywany.", "« Utilisé pour » : chaque NAS sert aux sauvegardes, à la synchro, ou aux deux ; plusieurs synchros possibles avec le même NAS, chacune dans son dossier.": "„Używany do”: każdy NAS służy do kopii, do synchro lub do obu; kilka synchro z tym samym NAS-em, każda we własnym folderze.", "Tâches : « Voir la sauvegarde », mettre une sauvegarde à la corbeille, cocher plusieurs tâches.": "Zadania: „Zobacz kopię”, przeniesienie kopii do kosza, zaznaczanie kilku zadań.", "Communauté : « Messages de la communauté », « Laisser un message » et « Suivez-nous » (X, YouTube, Reddit) ; Projets à financer : PS5 Center et sa jauge.": "Społeczność: „Wiadomości od społeczności”, „Zostaw wiadomość” i „Obserwuj nas” (X, YouTube, Reddit); Projekty do sfinansowania: PS5 Center i jego pasek postępu.", "Clavier complet : caractères spéciaux (R1), majuscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "Pełna klawiatura: znaki specjalne (R1), wielkie litery (L1), é è à ç; każdy przycisk pokazuje swój przycisk kontrolera.", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "NAS przez WebDAV znacznie szybszy; ten sam NAS dodany dwoma protokołami liczy się tylko raz, a jego kopie pokazują, którą drogą idą.", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "Start: jedna karta Synchro, która przewija kolejne urządzenia; „Dostępne zapisy” wymienia tylko miejsca, które naprawdę je mają.", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "Biblioteka: cały rząd filtrów mieści się na ekranie; inną konsolę widać od razu, z jasnymi nazwami („Wszystkie jej gry”, „Brak tutaj”, „Też tutaj”).", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "Zapisy: Kosz jest zawsze widoczny, karta „Wewnętrzna” pojawia się, gdy są kopie, można usunąć kilka zaznaczonych elementów.", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "Zgłoś problem: trzy czytelne karty (błąd, pytanie, gwiazdka) z ich kodem; Ustawienia w nowej kolejności.", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "Nowe obrazy urządzeń (Chmura, FTP / SMB) tej samej wysokości co pozostałe; nasze logo na karcie „Aktualizacja”.", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "Przywracanie z NAS-a: pełna kopia przechodzi przez przywracanie z przewodnikiem.", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS: koniec z folderem „PBC Backup/PBC Backup”; w katalogu głównym Synology test prosi o wybranie folderu udostępnionego.", "Sauvegardes : la liste des endroits ne se répète plus sous chaque jeu ; une copie mise à la corbeille disparaît tout de suite.": "Zapisy: lista miejsc nie powtarza się już pod każdą grą; kopia przeniesiona do kosza znika od razu.", "Mises à jour : un fichier qui échoue est réessayé une fois ; une version installée mais pas encore active est bien indiquée.": "Aktualizacje: plik, który się nie powiedzie, jest ponawiany raz; wersja zainstalowana, ale jeszcze nieaktywna, jest poprawnie oznaczona.", "Petits défauts d'affichage corrigés : textes coupés, codes QR de tailles différentes, étiquettes qui se chevauchaient.": "Poprawiono drobne błędy wyświetlania: ucięte teksty, kody QR różnej wielkości, nachodzące na siebie etykiety.", "Bêta": "Beta", "Canal bêta": "Kanał beta", "Stable (recommandé)": "Stabilny (zalecany)", "Canal des mises à jour": "Kanał aktualizacji", "Quoi de neuf": "Co nowego", "Nouveau": "Nowy", "Améliorations": "Ulepszenia", "Corrections": "Poprawki", "Toutes les versions": "Wszystkie wersje", "Signaler un problème": "Zgłoś problem", "Suivez-nous": "Obserwuj nas", "Soutenir le projet": "Wesprzyj projekt", "Revenir à la version précédente": "Powrót do poprzedniej wersji", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Wersje beta pojawiają się przed stabilnymi, aby można je było wypróbować. Mogą zawierać błędy; „Wróć do poprzedniej wersji” nadal działa. W każdej chwili możesz wrócić do Stabilnego.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Ustawienia › Aktualizacje › Kanał aktualizacji: Stabilny (zalecany, domyślny) lub Beta. W kanale Beta wersje testowe pojawiają się przed stabilnymi, oznaczone jako „beta” w Dostępnych wersjach; „Wróć do poprzedniej wersji” nadal działa.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Wersja beta nigdy nie jest publikowana jako wydanie GitHub: Prospero Store i inne katalogi oferują tylko wersje stabilne.", "Installer": "Zainstaluj", "Téléchargez PPSA99950.zip ci-dessous et décompressez-le : vous obtenez un dossier PPSA99950.": "Pobierz poniżej PPSA99950.zip i rozpakuj: otrzymasz folder PPSA99950.", "Copiez-le dans /data/homebrew/ sur votre PS5 (FTP ou USB).": "Skopiuj go do /data/homebrew/ na swojej PS5 (FTP lub USB).", "Ouvrez PS5 Backup Center depuis votre lanceur homebrew. L'appli démarre son propre moteur.": "Otwórz PS5 Backup Center z launchera homebrew. Aplikacja uruchamia własny silnik.", "Facultatif : {elf} démarre le moteur seul depuis un chargeur d'ELF (port 9021).": "Opcjonalnie: {elf} uruchamia sam silnik z loadera ELF (port 9021).", "Il faut une PS5 qui lance déjà des applis homebrew. Déjà installée ? Passez simplement au canal Bêta dans l'appli.": "Wymaga PS5, która już uruchamia aplikacje homebrew. Masz już aplikację? Po prostu przełącz się w niej na kanał Beta.", "Fichiers": "Pliki", "Sommes de contrôle (SHA-256)": "Sumy kontrolne (SHA-256)"}, "tr": {"PS5 Backup Center 3": "PS5 Backup Center 3", "Stockage dans le nuage (Appareils › Nuage) : Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 ou tout autre service S3, choisis par leur nom ; l'adresse se remplit toute seule.": "Bulut depolama (Cihazlar › Bulut): Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 veya başka herhangi bir S3 hizmeti, adıyla seçilir; adres kendiliğinden dolar.", "pCloud, Koofr et Nextcloud en WebDAV, préréglés.": "pCloud, Koofr ve Nextcloud WebDAV ile, hazır ayarlı.", "Google Drive, OneDrive et Dropbox : chacun connecte son propre compte depuis son téléphone (code QR, connexion chez le service), sans rien taper sur la PS5 ; l'appli n'a accès qu'à son propre dossier. Activation dans une prochaine mise à jour.": "Google Drive, OneDrive ve Dropbox: herkes kendi hesabını telefonundan bağlar (QR kodu, hizmette oturum açma), PS5'te hiçbir şey yazmadan; uygulama yalnızca kendi klasörüne erişir. Gelecek bir güncellemede etkinleşecek.", "Un stockage dans le nuage s'utilise comme un NAS (sauvegardes, destination, synchro) ; ses clés se collent depuis le téléphone grâce à un code QR.": "Bulut depolama bir NAS gibi kullanılır (yedekler, hedef, eşitleme); anahtarları QR kodu ile telefondan yapıştırılır.", "NAS en WebDAV (Synology, QNAP, Nextcloud…) à côté de FTP et SMB ; le certificat maison du NAS est accepté une fois puis retenu.": "FTP ve SMB'nin yanında WebDAV ile NAS (Synology, QNAP, Nextcloud…); NAS'ın kendi sertifikası bir kez kabul edilir, sonra hatırlanır.", "« Utilisé pour » : chaque NAS sert aux sauvegardes, à la synchro, ou aux deux ; plusieurs synchros possibles avec le même NAS, chacune dans son dossier.": "“Kullanım”: her NAS yedekler, eşitleme ya da ikisi için kullanılır; aynı NAS ile her biri kendi klasöründe birden fazla eşitleme mümkün.", "Tâches : « Voir la sauvegarde », mettre une sauvegarde à la corbeille, cocher plusieurs tâches.": "Görevler: “Yedeği gör”, bir yedeği çöp kutusuna taşıma, birden fazla görevi işaretleme.", "Communauté : « Messages de la communauté », « Laisser un message » et « Suivez-nous » (X, YouTube, Reddit) ; Projets à financer : PS5 Center et sa jauge.": "Topluluk: “Topluluk mesajları”, “Mesaj bırak” ve “Bizi takip edin” (X, YouTube, Reddit); Finanse edilecek projeler: PS5 Center ve ilerleme çubuğu.", "Clavier complet : caractères spéciaux (R1), majuscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "Tam klavye: özel karakterler (R1), büyük harfler (L1), é è à ç; her düğme kendi kumanda tuşunu gösterir.", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "WebDAV ile NAS çok daha hızlı; iki protokolle eklenen aynı NAS yalnızca bir kez sayılır ve kopyaları hangi yoldan geldiğini gösterir.", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "Ana sayfa: her cihazı sırayla gösteren tek bir Eşitleme kartı; “Mevcut kayıtlar” yalnızca gerçekten kaydı olan yerleri listeler.", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "Kitaplık: tüm filtre satırı ekrana sığar; başka bir konsol bir bakışta görünür, açık adlarla (“Tüm oyunları”, “Burada yok”, “Burada da var”).", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "Kayıtlar: Çöp kutusu her zaman görünür, kopyalar olduğunda “Dahili” kartı belirir, işaretli birden fazla öğe silinebilir.", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "Sorun bildir: kodlarıyla birlikte üç açık kart (bir hata, bir soru, bir yıldız); Ayarlar yeniden sıralandı.", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "Yeni cihaz görselleri (Bulut, FTP / SMB) diğerleriyle aynı yükseklikte; “Güncelleme” kartında logomuz.", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "NAS'tan geri yükleme: tam yedek, rehberli geri yüklemeden geçer.", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS: artık “PBC Backup/PBC Backup” klasörü yok; bir Synology'nin kök dizininde test, paylaşılan bir klasör seçmenizi söyler.", "Sauvegardes : la liste des endroits ne se répète plus sous chaque jeu ; une copie mise à la corbeille disparaît tout de suite.": "Kayıtlar: yer listesi artık her oyunun altında tekrarlanmıyor; çöp kutusuna taşınan bir kopya hemen kaybolur.", "Mises à jour : un fichier qui échoue est réessayé une fois ; une version installée mais pas encore active est bien indiquée.": "Güncellemeler: başarısız olan bir dosya bir kez yeniden denenir; yüklenmiş ama henüz etkin olmayan bir sürüm doğru gösterilir.", "Petits défauts d'affichage corrigés : textes coupés, codes QR de tailles différentes, étiquettes qui se chevauchaient.": "Küçük görüntü sorunları düzeltildi: kesik metinler, farklı boyutlarda QR kodları, üst üste binen etiketler.", "Bêta": "Beta", "Canal bêta": "Beta kanalı", "Stable (recommandé)": "Kararlı (önerilen)", "Canal des mises à jour": "Güncelleme kanalı", "Quoi de neuf": "Yenilikler", "Nouveau": "Yeni", "Améliorations": "İyileştirmeler", "Corrections": "Düzeltmeler", "Toutes les versions": "Tüm sürümler", "Signaler un problème": "Sorun bildir", "Suivez-nous": "Bizi takip edin", "Soutenir le projet": "Projeyi destekle", "Revenir à la version précédente": "Önceki sürüme dön", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Betalar, denemeniz için kararlı sürümlerden önce gelir. Hata içerebilirler; “Önceki sürüme dön” yine kullanılabilir. İstediğiniz zaman Kararlı'ya dönün.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Ayarlar › Güncellemeler › Güncelleme kanalı: Kararlı (önerilen, varsayılan) veya Beta. Beta'da deneme sürümleri kararlı sürümlerden önce gelir ve Mevcut sürümler'de “beta” olarak işaretlenir; “Önceki sürüme dön” yine kullanılabilir.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Bir beta asla GitHub sürümü olarak yayımlanmaz: Prospero Store ve diğer kataloglar yalnızca kararlı sürümleri sunar.", "Installer": "Yükle", "Téléchargez PPSA99950.zip ci-dessous et décompressez-le : vous obtenez un dossier PPSA99950.": "Aşağıdan PPSA99950.zip dosyasını indirip açın: bir PPSA99950 klasörü elde edersiniz.", "Copiez-le dans /data/homebrew/ sur votre PS5 (FTP ou USB).": "Bunu PS5'inizde /data/homebrew/ içine kopyalayın (FTP veya USB).", "Ouvrez PS5 Backup Center depuis votre lanceur homebrew. L'appli démarre son propre moteur.": "PS5 Backup Center'ı homebrew başlatıcınızdan açın. Uygulama kendi motorunu başlatır.", "Facultatif : {elf} démarre le moteur seul depuis un chargeur d'ELF (port 9021).": "İsteğe bağlı: {elf}, motoru tek başına bir ELF yükleyiciden başlatır (bağlantı noktası 9021).", "Il faut une PS5 qui lance déjà des applis homebrew. Déjà installée ? Passez simplement au canal Bêta dans l'appli.": "Homebrew uygulamaları çalıştırabilen bir PS5 gerekir. Zaten yüklü mü? Uygulamada Beta kanalına geçmeniz yeterli.", "Fichiers": "Dosyalar", "Sommes de contrôle (SHA-256)": "Sağlama toplamları (SHA-256)"}, "ru": {"PS5 Backup Center 3": "PS5 Backup Center 3", "Stockage dans le nuage (Appareils › Nuage) : Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 ou tout autre service S3, choisis par leur nom ; l'adresse se remplit toute seule.": "Облачное хранилище (Устройства › Облако): Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 или любой другой сервис S3 — выбор по названию; адрес заполняется сам.", "pCloud, Koofr et Nextcloud en WebDAV, préréglés.": "pCloud, Koofr и Nextcloud по WebDAV, с готовыми настройками.", "Google Drive, OneDrive et Dropbox : chacun connecte son propre compte depuis son téléphone (code QR, connexion chez le service), sans rien taper sur la PS5 ; l'appli n'a accès qu'à son propre dossier. Activation dans une prochaine mise à jour.": "Google Drive, OneDrive и Dropbox: каждый подключает свой аккаунт с телефона (QR-код, вход на сайте сервиса), ничего не вводя на PS5; приложение видит только свою папку. Включение — в одном из следующих обновлений.", "Un stockage dans le nuage s'utilise comme un NAS (sauvegardes, destination, synchro) ; ses clés se collent depuis le téléphone grâce à un code QR.": "Облачное хранилище используется как NAS (копии, место назначения, синхро); его ключи вставляются с телефона через QR-код.", "NAS en WebDAV (Synology, QNAP, Nextcloud…) à côté de FTP et SMB ; le certificat maison du NAS est accepté une fois puis retenu.": "NAS по WebDAV (Synology, QNAP, Nextcloud…) наряду с FTP и SMB; собственный сертификат NAS принимается один раз и запоминается.", "« Utilisé pour » : chaque NAS sert aux sauvegardes, à la synchro, ou aux deux ; plusieurs synchros possibles avec le même NAS, chacune dans son dossier.": "«Используется для»: каждый NAS служит для копий, синхро или того и другого; несколько синхро с одним NAS, каждая в своей папке.", "Tâches : « Voir la sauvegarde », mettre une sauvegarde à la corbeille, cocher plusieurs tâches.": "Задачи: «Открыть копию», перемещение копии в корзину, отметка нескольких задач.", "Communauté : « Messages de la communauté », « Laisser un message » et « Suivez-nous » (X, YouTube, Reddit) ; Projets à financer : PS5 Center et sa jauge.": "Сообщество: «Сообщения сообщества», «Оставить сообщение» и «Подписывайтесь» (X, YouTube, Reddit); Проекты для финансирования: PS5 Center и его шкала.", "Clavier complet : caractères spéciaux (R1), majuscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "Полная клавиатура: спецсимволы (R1), заглавные буквы (L1), é è à ç; на каждой кнопке показана её кнопка геймпада.", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "NAS по WebDAV работает гораздо быстрее; один NAS, добавленный по двум протоколам, учитывается один раз, а его копии показывают свой способ.", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "Главная: одна карточка Синхро, которая прокручивает все устройства; «Доступные сохранения» называют только места, где они действительно есть.", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "Библиотека: весь ряд фильтров помещается на экране; другую консоль видно с первого взгляда, с понятными названиями («Все её игры», «Нет здесь», «Есть и здесь»).", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "Сохранения: Корзина всегда видна, карточка «Внутренний» появляется, когда есть копии, можно удалить несколько отмеченных элементов.", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "Сообщить о проблеме: три понятные карточки (ошибка, вопрос, звезда) с их кодом; Настройки упорядочены заново.", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "Новые изображения устройств (Облако, FTP / SMB) той же высоты, что и остальные; наш логотип на карточке «Обновление».", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "Восстановление с NAS: полная копия проходит через пошаговое восстановление.", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS: больше нет папки «PBC Backup/PBC Backup»; в корне Synology проверка просит выбрать общую папку.", "Sauvegardes : la liste des endroits ne se répète plus sous chaque jeu ; une copie mise à la corbeille disparaît tout de suite.": "Сохранения: список мест больше не повторяется под каждой игрой; копия, перемещённая в корзину, сразу исчезает.", "Mises à jour : un fichier qui échoue est réessayé une fois ; une version installée mais pas encore active est bien indiquée.": "Обновления: файл, загрузка которого не удалась, повторяется один раз; установленная, но ещё не активная версия отображается правильно.", "Petits défauts d'affichage corrigés : textes coupés, codes QR de tailles différentes, étiquettes qui se chevauchaient.": "Исправлены мелкие ошибки отображения: обрезанный текст, QR-коды разного размера, наложение подписей.", "Bêta": "Бета", "Canal bêta": "Бета-канал", "Stable (recommandé)": "Стабильный (рекомендуется)", "Canal des mises à jour": "Канал обновлений", "Quoi de neuf": "Что нового", "Nouveau": "Новый", "Améliorations": "Улучшения", "Corrections": "Исправления", "Toutes les versions": "Все версии", "Signaler un problème": "Сообщить о проблеме", "Suivez-nous": "Подписывайтесь", "Soutenir le projet": "Поддержать проект", "Revenir à la version précédente": "Вернуться к предыдущей версии", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Бета-версии выходят раньше стабильных, чтобы их можно было попробовать. В них могут быть ошибки; «Вернуться к предыдущей версии» остаётся доступным. Вернуться на «Стабильный» можно в любой момент.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Настройки › Обновления › Канал обновлений: «Стабильный» (рекомендуется, по умолчанию) или «Бета». В бета-канале тестовые версии выходят раньше стабильных и помечены «бета» в списке доступных версий; «Вернуться к предыдущей версии» остаётся доступным.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Бета-версия никогда не публикуется как релиз GitHub: Prospero Store и другие каталоги предлагают только стабильные версии.", "Installer": "Установить", "Téléchargez PPSA99950.zip ci-dessous et décompressez-le : vous obtenez un dossier PPSA99950.": "Скачайте PPSA99950.zip ниже и распакуйте: получится папка PPSA99950.", "Copiez-le dans /data/homebrew/ sur votre PS5 (FTP ou USB).": "Скопируйте её в /data/homebrew/ на PS5 (FTP или USB).", "Ouvrez PS5 Backup Center depuis votre lanceur homebrew. L'appli démarre son propre moteur.": "Откройте PS5 Backup Center из лаунчера homebrew. Приложение само запускает свой движок.", "Facultatif : {elf} démarre le moteur seul depuis un chargeur d'ELF (port 9021).": "Необязательно: {elf} запускает только движок из ELF-загрузчика (порт 9021).", "Il faut une PS5 qui lance déjà des applis homebrew. Déjà installée ? Passez simplement au canal Bêta dans l'appli.": "Нужна PS5, на которой уже запускаются homebrew-приложения. Уже установлено? Просто переключитесь на бета-канал в приложении.", "Fichiers": "Файлы", "Sommes de contrôle (SHA-256)": "Контрольные суммы (SHA-256)"}, "zh-Hans": {"PS5 Backup Center 3": "PS5 Backup Center 3", "Stockage dans le nuage (Appareils › Nuage) : Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 ou tout autre service S3, choisis par leur nom ; l'adresse se remplit toute seule.": "云存储（设备 › 云端）：Amazon S3、Backblaze B2、Wasabi、Cloudflare R2、Scaleway、OVHcloud、Synology C2 或任何其他 S3 服务，按名称选择；地址自动填写。", "pCloud, Koofr et Nextcloud en WebDAV, préréglés.": "pCloud、Koofr 和 Nextcloud 通过 WebDAV 连接，已预先设置。", "Google Drive, OneDrive et Dropbox : chacun connecte son propre compte depuis son téléphone (code QR, connexion chez le service), sans rien taper sur la PS5 ; l'appli n'a accès qu'à son propre dossier. Activation dans une prochaine mise à jour.": "Google Drive、OneDrive 和 Dropbox：每个人用自己的手机连接自己的帐户（扫描 QR 码，在服务方登录），无需在 PS5 上输入任何内容；应用只能访问自己的文件夹。将在后续更新中启用。", "Un stockage dans le nuage s'utilise comme un NAS (sauvegardes, destination, synchro) ; ses clés se collent depuis le téléphone grâce à un code QR.": "云存储可以像 NAS 一样使用（备份、目标位置、同步）；其密钥可通过 QR 码从手机粘贴。", "NAS en WebDAV (Synology, QNAP, Nextcloud…) à côté de FTP et SMB ; le certificat maison du NAS est accepté une fois puis retenu.": "NAS 支持 WebDAV（Synology、QNAP、Nextcloud…），与 FTP 和 SMB 并列；NAS 的自签名证书只需接受一次，之后会被记住。", "« Utilisé pour » : chaque NAS sert aux sauvegardes, à la synchro, ou aux deux ; plusieurs synchros possibles avec le même NAS, chacune dans son dossier.": "“用途”：每台 NAS 可用于备份、同步或两者兼有；同一台 NAS 可设置多个同步，各自使用自己的文件夹。", "Tâches : « Voir la sauvegarde », mettre une sauvegarde à la corbeille, cocher plusieurs tâches.": "任务：“查看备份”、将备份移到回收站、勾选多个任务。", "Communauté : « Messages de la communauté », « Laisser un message » et « Suivez-nous » (X, YouTube, Reddit) ; Projets à financer : PS5 Center et sa jauge.": "社区：“社区留言”、“留言”和“关注我们”（X、YouTube、Reddit）；待资助的项目：PS5 Center 及其进度条。", "Clavier complet : caractères spéciaux (R1), majuscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "完整键盘：特殊字符（R1）、大写字母（L1）、é è à ç；每个按钮都显示对应的手柄按键。", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "WebDAV NAS 速度大幅提升；通过两种协议添加的同一台 NAS 只计算一次，其副本会注明所用方式。", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "首页：只有一张同步卡片，轮流显示每台设备；“可用存档”只列出真正有存档的位置。", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "游戏库：整排筛选器都能显示在屏幕上；另一台主机一目了然，名称清晰（“它的全部游戏”、“这里没有”、“本机也有”）。", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "存档：回收站始终可见，有副本时会出现“内置”卡片，可以删除多个勾选的项目。", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "报告问题：三张清晰的卡片（错误、问题、星标）及其代码；设置已重新排序。", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "新的设备图片（云端、FTP / SMB）与其他图片同高；“更新”卡片上显示我们的标志。", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "从 NAS 恢复：完整备份会通过引导式恢复进行。", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS：不再出现“PBC Backup/PBC Backup”文件夹；在 Synology 的根目录下，测试会提示选择一个共享文件夹。", "Sauvegardes : la liste des endroits ne se répète plus sous chaque jeu ; une copie mise à la corbeille disparaît tout de suite.": "存档：位置列表不再在每个游戏下重复出现；移到回收站的副本会立即消失。", "Mises à jour : un fichier qui échoue est réessayé une fois ; une version installée mais pas encore active est bien indiquée.": "更新：失败的文件会重试一次；已安装但尚未生效的版本会正确显示。", "Petits défauts d'affichage corrigés : textes coupés, codes QR de tailles différentes, étiquettes qui se chevauchaient.": "修复了小的显示问题：文字被截断、QR 码大小不一、标签重叠。", "Bêta": "测试版", "Canal bêta": "测试版渠道", "Stable (recommandé)": "稳定版（推荐）", "Canal des mises à jour": "更新渠道", "Quoi de neuf": "新功能", "Nouveau": "新建", "Améliorations": "改进", "Corrections": "修复", "Toutes les versions": "所有版本", "Signaler un problème": "报告问题", "Suivez-nous": "关注我们", "Soutenir le projet": "支持本项目", "Revenir à la version précédente": "回到上一个版本", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "测试版会先于稳定版推出，方便抢先试用。它们可能存在问题；仍可“回到上一个版本”。随时可以切换回稳定版。", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "设置 › 更新 › 更新渠道：稳定版（推荐，默认）或测试版。选择测试版后，测试版本会先于稳定版推出，并在“可用版本”中标为“测试版”；仍可“回到上一个版本”。", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "测试版从不作为 GitHub 版本发布：Prospero Store 和其他目录只提供稳定版。", "Installer": "安装", "Téléchargez PPSA99950.zip ci-dessous et décompressez-le : vous obtenez un dossier PPSA99950.": "下载下方的 PPSA99950.zip 并解压，得到一个 PPSA99950 文件夹。", "Copiez-le dans /data/homebrew/ sur votre PS5 (FTP ou USB).": "将其复制到 PS5 的 /data/homebrew/（FTP 或 USB）。", "Ouvrez PS5 Backup Center depuis votre lanceur homebrew. L'appli démarre son propre moteur.": "从自制程序启动器打开 PS5 Backup Center。应用会自行启动引擎。", "Facultatif : {elf} démarre le moteur seul depuis un chargeur d'ELF (port 9021).": "可选：{elf} 可通过 ELF 加载器单独启动引擎（端口 9021）。", "Il faut une PS5 qui lance déjà des applis homebrew. Déjà installée ? Passez simplement au canal Bêta dans l'appli.": "需要一台已能运行自制应用的 PS5。已经安装？只需在应用中切换到测试版通道。", "Fichiers": "文件", "Sommes de contrôle (SHA-256)": "校验和（SHA-256）"}, "zh-Hant": {"PS5 Backup Center 3": "PS5 Backup Center 3", "Stockage dans le nuage (Appareils › Nuage) : Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 ou tout autre service S3, choisis par leur nom ; l'adresse se remplit toute seule.": "雲端儲存（裝置 › 雲端）：Amazon S3、Backblaze B2、Wasabi、Cloudflare R2、Scaleway、OVHcloud、Synology C2 或任何其他 S3 服務，依名稱選擇；位址會自動填入。", "pCloud, Koofr et Nextcloud en WebDAV, préréglés.": "pCloud、Koofr 和 Nextcloud 透過 WebDAV 連線，已預先設定。", "Google Drive, OneDrive et Dropbox : chacun connecte son propre compte depuis son téléphone (code QR, connexion chez le service), sans rien taper sur la PS5 ; l'appli n'a accès qu'à son propre dossier. Activation dans une prochaine mise à jour.": "Google Drive、OneDrive 和 Dropbox：每個人用自己的手機連結自己的帳號（掃描 QR 碼，在服務端登入），無需在 PS5 上輸入任何內容；應用程式只能存取自己的資料夾。將在後續更新中啟用。", "Un stockage dans le nuage s'utilise comme un NAS (sauvegardes, destination, synchro) ; ses clés se collent depuis le téléphone grâce à un code QR.": "雲端儲存可以像 NAS 一樣使用（備份、目的地、同步）；其金鑰可透過 QR 碼從手機貼上。", "NAS en WebDAV (Synology, QNAP, Nextcloud…) à côté de FTP et SMB ; le certificat maison du NAS est accepté une fois puis retenu.": "NAS 支援 WebDAV（Synology、QNAP、Nextcloud…），與 FTP 和 SMB 並列；NAS 的自簽憑證只需接受一次，之後會被記住。", "« Utilisé pour » : chaque NAS sert aux sauvegardes, à la synchro, ou aux deux ; plusieurs synchros possibles avec le même NAS, chacune dans son dossier.": "「用途」：每台 NAS 可用於備份、同步或兩者兼具；同一台 NAS 可設定多個同步，各自使用自己的資料夾。", "Tâches : « Voir la sauvegarde », mettre une sauvegarde à la corbeille, cocher plusieurs tâches.": "工作：「查看備份」、將備份移到資源回收筒、勾選多個工作。", "Communauté : « Messages de la communauté », « Laisser un message » et « Suivez-nous » (X, YouTube, Reddit) ; Projets à financer : PS5 Center et sa jauge.": "社群：「社群留言」、「留言」和「追蹤我們」（X、YouTube、Reddit）；待資助的專案：PS5 Center 及其進度條。", "Clavier complet : caractères spéciaux (R1), majuscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "完整鍵盤：特殊字元（R1）、大寫字母（L1）、é è à ç；每個按鈕都會顯示對應的手把按鍵。", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "WebDAV NAS 速度大幅提升；透過兩種通訊協定新增的同一台 NAS 只計算一次，其副本會註明所用方式。", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "首頁：只有一張同步卡片，輪流顯示每台裝置；「可用存檔」只列出真正有存檔的位置。", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "遊戲庫：整排篩選器都能顯示在畫面上；另一台主機一目了然，名稱清楚（「它的全部遊戲」、「這裡沒有」、「本機也有」）。", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "存檔：資源回收筒一律可見，有副本時會出現「內建」卡片，可以刪除多個勾選的項目。", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "回報問題：三張清楚的卡片（錯誤、問題、星號）及其代碼；設定已重新排序。", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "新的裝置圖片（雲端、FTP / SMB）與其他圖片同高；「更新」卡片上顯示我們的標誌。", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "從 NAS 還原：完整備份會透過引導式還原進行。", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS：不再出現「PBC Backup/PBC Backup」資料夾；在 Synology 的根目錄下，測試會提示選擇一個共用資料夾。", "Sauvegardes : la liste des endroits ne se répète plus sous chaque jeu ; une copie mise à la corbeille disparaît tout de suite.": "存檔：位置清單不再於每個遊戲下重複出現；移到資源回收筒的副本會立即消失。", "Mises à jour : un fichier qui échoue est réessayé une fois ; une version installée mais pas encore active est bien indiquée.": "更新：失敗的檔案會重試一次；已安裝但尚未生效的版本會正確顯示。", "Petits défauts d'affichage corrigés : textes coupés, codes QR de tailles différentes, étiquettes qui se chevauchaient.": "修正了小的顯示問題：文字被截斷、QR 碼大小不一、標籤重疊。", "Bêta": "測試版", "Canal bêta": "測試版頻道", "Stable (recommandé)": "穩定版（建議）", "Canal des mises à jour": "更新頻道", "Quoi de neuf": "新功能", "Nouveau": "新增", "Améliorations": "改進", "Corrections": "修正", "Toutes les versions": "所有版本", "Signaler un problème": "回報問題", "Suivez-nous": "追蹤我們", "Soutenir le projet": "支持本專案", "Revenir à la version précédente": "回到上一個版本", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "測試版會先於穩定版推出，方便搶先試用。可能存在問題；仍可「回到上一個版本」。隨時可以切換回穩定版。", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "設定 › 更新 › 更新頻道：穩定版（建議，預設）或測試版。選擇測試版後，測試版本會先於穩定版推出，並在「可用版本」中標示為「測試版」；仍可「回到上一個版本」。", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "測試版從不以 GitHub 版本發布：Prospero Store 與其他目錄只提供穩定版。", "Installer": "安裝", "Téléchargez PPSA99950.zip ci-dessous et décompressez-le : vous obtenez un dossier PPSA99950.": "下載下方的 PPSA99950.zip 並解壓縮，會得到一個 PPSA99950 資料夾。", "Copiez-le dans /data/homebrew/ sur votre PS5 (FTP ou USB).": "將其複製到 PS5 的 /data/homebrew/（FTP 或 USB）。", "Ouvrez PS5 Backup Center depuis votre lanceur homebrew. L'appli démarre son propre moteur.": "從自製程式啟動器開啟 PS5 Backup Center。應用程式會自行啟動引擎。", "Facultatif : {elf} démarre le moteur seul depuis un chargeur d'ELF (port 9021).": "選用：{elf} 可透過 ELF 載入器單獨啟動引擎（連接埠 9021）。", "Il faut une PS5 qui lance déjà des applis homebrew. Déjà installée ? Passez simplement au canal Bêta dans l'appli.": "需要一台已能執行自製應用程式的 PS5。已經安裝？只要在應用程式中切換到測試版頻道即可。", "Fichiers": "檔案", "Sommes de contrôle (SHA-256)": "總和檢查碼（SHA-256）"}, "ja": {"PS5 Backup Center 3": "PS5 Backup Center 3", "Stockage dans le nuage (Appareils › Nuage) : Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 ou tout autre service S3, choisis par leur nom ; l'adresse se remplit toute seule.": "クラウドストレージ（デバイス › クラウド）：Amazon S3、Backblaze B2、Wasabi、Cloudflare R2、Scaleway、OVHcloud、Synology C2 など、あらゆる S3 サービスを名前で選べます。アドレスは自動で入力されます。", "pCloud, Koofr et Nextcloud en WebDAV, préréglés.": "pCloud、Koofr、Nextcloud を WebDAV で、設定済みで利用できます。", "Google Drive, OneDrive et Dropbox : chacun connecte son propre compte depuis son téléphone (code QR, connexion chez le service), sans rien taper sur la PS5 ; l'appli n'a accès qu'à son propre dossier. Activation dans une prochaine mise à jour.": "Google Drive、OneDrive、Dropbox：各自が自分のスマートフォンから自分のアカウントを接続（QR コード、サービス側でサインイン）、PS5 では何も入力しません。アプリがアクセスできるのは専用フォルダーだけです。今後のアップデートで有効になります。", "Un stockage dans le nuage s'utilise comme un NAS (sauvegardes, destination, synchro) ; ses clés se collent depuis le téléphone grâce à un code QR.": "クラウドストレージは NAS と同じように使えます（バックアップ、保存先、同期）。キーは QR コードを使ってスマートフォンから貼り付けます。", "NAS en WebDAV (Synology, QNAP, Nextcloud…) à côté de FTP et SMB ; le certificat maison du NAS est accepté une fois puis retenu.": "FTP、SMB に加えて WebDAV の NAS（Synology、QNAP、Nextcloud…）に対応。NAS の自己署名証明書は一度承認すれば記憶されます。", "« Utilisé pour » : chaque NAS sert aux sauvegardes, à la synchro, ou aux deux ; plusieurs synchros possibles avec le même NAS, chacune dans son dossier.": "「用途」：各 NAS をバックアップ、同期、またはその両方に使えます。同じ NAS で複数の同期を、それぞれ別のフォルダーで行えます。", "Tâches : « Voir la sauvegarde », mettre une sauvegarde à la corbeille, cocher plusieurs tâches.": "タスク：「バックアップを見る」、バックアップをゴミ箱に移動、複数のタスクにチェック。", "Communauté : « Messages de la communauté », « Laisser un message » et « Suivez-nous » (X, YouTube, Reddit) ; Projets à financer : PS5 Center et sa jauge.": "コミュニティ：「コミュニティのメッセージ」、「メッセージを残す」、「フォローする」（X、YouTube、Reddit）。支援を募るプロジェクト：PS5 Center とその進捗バー。", "Clavier complet : caractères spéciaux (R1), majuscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "フルキーボード：特殊文字（R1）、大文字（L1）、é è à ç。各ボタンに対応するコントローラーのボタンを表示。", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "WebDAV の NAS が大幅に高速化。2 つのプロトコルで追加した同じ NAS は 1 台として数え、コピーには経路が表示されます。", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "ホーム：同期カードは 1 枚になり、各デバイスを順に表示。「利用できるセーブデータ」は実際にデータがある場所だけを表示します。", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "ライブラリー：フィルターの列が画面に収まります。別のゲーム機がひと目でわかり、名前もわかりやすく（「すべてのゲーム」、「ここにない」、「ここにもある」）。", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "セーブデータ：ゴミ箱を常に表示、コピーがあるときは「本体ストレージ」カードが表示され、チェックした複数の項目を削除できます。", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "問題を報告：わかりやすい 3 枚のカード（バグ、質問、スター）とそのコード。設定の並び順を変更。", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "新しいデバイス画像（クラウド、FTP / SMB）をほかの画像と同じ高さに。「アップデート」カードに私たちのロゴ。", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "NAS から復元：完全バックアップはガイド付き復元で行われます。", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS：「PBC Backup/PBC Backup」フォルダーが作られなくなりました。Synology のルートでは、共有フォルダーを選ぶようテストが案内します。", "Sauvegardes : la liste des endroits ne se répète plus sous chaque jeu ; une copie mise à la corbeille disparaît tout de suite.": "セーブデータ：場所の一覧がゲームごとに繰り返し表示されなくなりました。ゴミ箱に移動したコピーはすぐに消えます。", "Mises à jour : un fichier qui échoue est réessayé une fois ; une version installée mais pas encore active est bien indiquée.": "アップデート：失敗したファイルは一度だけ再試行。インストール済みでまだ有効になっていないバージョンを正しく表示します。", "Petits défauts d'affichage corrigés : textes coupés, codes QR de tailles différentes, étiquettes qui se chevauchaient.": "細かな表示の不具合を修正：途切れた文字、大きさの違う QR コード、重なったラベル。", "Bêta": "ベータ", "Canal bêta": "ベータチャンネル", "Stable (recommandé)": "安定版（推奨）", "Canal des mises à jour": "アップデートチャンネル", "Quoi de neuf": "新機能", "Nouveau": "新規", "Améliorations": "改善", "Corrections": "修正", "Toutes les versions": "すべてのバージョン", "Signaler un problème": "問題を報告", "Suivez-nous": "フォローする", "Soutenir le projet": "プロジェクトを支援", "Revenir à la version précédente": "前のバージョンに戻す", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "ベータ版は安定版より先に公開され、いち早く試せます。不具合を含む場合があります。「前のバージョンに戻す」は引き続き使えます。いつでも安定版に戻せます。", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "設定 › アップデート › アップデートチャンネル：安定版（推奨・既定）またはベータ。ベータでは試験版が安定版より先に届き、「利用できるバージョン」に「ベータ」と表示されます。「前のバージョンに戻す」も引き続き使えます。", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "ベータ版が GitHub のリリースとして公開されることはありません。Prospero Store などのカタログには安定版だけが並びます。", "Installer": "インストール", "Téléchargez PPSA99950.zip ci-dessous et décompressez-le : vous obtenez un dossier PPSA99950.": "下の PPSA99950.zip をダウンロードして展開すると、PPSA99950 フォルダーができます。", "Copiez-le dans /data/homebrew/ sur votre PS5 (FTP ou USB).": "それを PS5 の /data/homebrew/ にコピーします（FTP または USB）。", "Ouvrez PS5 Backup Center depuis votre lanceur homebrew. L'appli démarre son propre moteur.": "Homebrew ランチャーから PS5 Backup Center を開きます。アプリが自分でエンジンを起動します。", "Facultatif : {elf} démarre le moteur seul depuis un chargeur d'ELF (port 9021).": "任意：{elf} は ELF ローダーからエンジンだけを起動します（ポート 9021）。", "Il faut une PS5 qui lance déjà des applis homebrew. Déjà installée ? Passez simplement au canal Bêta dans l'appli.": "Homebrew アプリを実行できる PS5 が必要です。インストール済みの場合は、アプリでベータチャンネルに切り替えるだけです。", "Fichiers": "ファイル", "Sommes de contrôle (SHA-256)": "チェックサム（SHA-256）"}, "ko": {"PS5 Backup Center 3": "PS5 Backup Center 3", "Stockage dans le nuage (Appareils › Nuage) : Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 ou tout autre service S3, choisis par leur nom ; l'adresse se remplit toute seule.": "클라우드 스토리지(기기 › 클라우드): Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 또는 다른 모든 S3 서비스를 이름으로 선택하면 주소가 자동으로 채워집니다.", "pCloud, Koofr et Nextcloud en WebDAV, préréglés.": "pCloud, Koofr, Nextcloud를 WebDAV로, 미리 설정된 상태로 사용.", "Google Drive, OneDrive et Dropbox : chacun connecte son propre compte depuis son téléphone (code QR, connexion chez le service), sans rien taper sur la PS5 ; l'appli n'a accès qu'à son propre dossier. Activation dans une prochaine mise à jour.": "Google Drive, OneDrive, Dropbox: 각자 자기 휴대폰에서 자기 계정을 연결합니다(QR 코드, 서비스에서 로그인). PS5에서는 아무것도 입력하지 않으며, 앱은 자기 폴더에만 접근합니다. 다음 업데이트에서 활성화됩니다.", "Un stockage dans le nuage s'utilise comme un NAS (sauvegardes, destination, synchro) ; ses clés se collent depuis le téléphone grâce à un code QR.": "클라우드 스토리지는 NAS처럼 사용합니다(백업, 대상, 동기화). 키는 QR 코드로 휴대폰에서 붙여넣습니다.", "NAS en WebDAV (Synology, QNAP, Nextcloud…) à côté de FTP et SMB ; le certificat maison du NAS est accepté une fois puis retenu.": "FTP, SMB와 함께 WebDAV NAS(Synology, QNAP, Nextcloud…) 지원. NAS의 자체 서명 인증서는 한 번 승인하면 기억됩니다.", "« Utilisé pour » : chaque NAS sert aux sauvegardes, à la synchro, ou aux deux ; plusieurs synchros possibles avec le même NAS, chacune dans son dossier.": "'용도': 각 NAS를 백업, 동기화 또는 둘 다에 사용합니다. 같은 NAS로 여러 동기화를 각자의 폴더에서 할 수 있습니다.", "Tâches : « Voir la sauvegarde », mettre une sauvegarde à la corbeille, cocher plusieurs tâches.": "작업: '백업 보기', 백업을 휴지통으로 이동, 여러 작업 선택.", "Communauté : « Messages de la communauté », « Laisser un message » et « Suivez-nous » (X, YouTube, Reddit) ; Projets à financer : PS5 Center et sa jauge.": "커뮤니티: '커뮤니티 메시지', '메시지 남기기', '팔로우하기'(X, YouTube, Reddit). 후원이 필요한 프로젝트: PS5 Center와 진행 막대.", "Clavier complet : caractères spéciaux (R1), majuscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "전체 키보드: 특수 문자(R1), 대문자(L1), é è à ç. 각 버튼에 해당 컨트롤러 버튼이 표시됩니다.", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "WebDAV NAS가 훨씬 빨라졌습니다. 두 프로토콜로 추가한 같은 NAS는 한 번만 계산되고, 복사본에는 사용한 방식이 표시됩니다.", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "홈: 각 기기를 차례로 보여 주는 동기화 카드 하나. '사용 가능한 세이브 데이터'는 실제로 데이터가 있는 위치만 표시합니다.", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "라이브러리: 필터 줄 전체가 화면에 들어갑니다. 다른 콘솔을 한눈에 볼 수 있고 이름도 명확합니다('모든 게임', '여기에 없음', '여기에도 있음').", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "세이브 데이터: 휴지통이 항상 보이고, 복사본이 있으면 '내부 저장공간' 카드가 나타나며, 선택한 여러 항목을 삭제할 수 있습니다.", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "문제 신고: 코드가 있는 명확한 카드 세 장(버그, 질문, 별점). 설정 순서 변경.", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "새 기기 이미지(클라우드, FTP / SMB)를 다른 이미지와 같은 높이로. '업데이트' 카드에 우리 로고.", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "NAS에서 복원: 전체 백업은 안내에 따른 복원으로 진행됩니다.", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS: 더 이상 'PBC Backup/PBC Backup' 폴더가 생기지 않습니다. Synology의 루트에서는 테스트가 공유 폴더를 선택하라고 안내합니다.", "Sauvegardes : la liste des endroits ne se répète plus sous chaque jeu ; une copie mise à la corbeille disparaît tout de suite.": "세이브 데이터: 위치 목록이 게임마다 반복되지 않습니다. 휴지통으로 옮긴 복사본은 바로 사라집니다.", "Mises à jour : un fichier qui échoue est réessayé une fois ; une version installée mais pas encore active est bien indiquée.": "업데이트: 실패한 파일은 한 번 다시 시도합니다. 설치되었지만 아직 활성화되지 않은 버전이 올바르게 표시됩니다.", "Petits défauts d'affichage corrigés : textes coupés, codes QR de tailles différentes, étiquettes qui se chevauchaient.": "작은 표시 오류 수정: 잘린 텍스트, 크기가 다른 QR 코드, 겹치는 라벨.", "Bêta": "베타", "Canal bêta": "베타 채널", "Stable (recommandé)": "안정판 (권장)", "Canal des mises à jour": "업데이트 채널", "Quoi de neuf": "새로운 기능", "Nouveau": "새로 만들기", "Améliorations": "개선 사항", "Corrections": "수정 사항", "Toutes les versions": "모든 버전", "Signaler un problème": "문제 신고", "Suivez-nous": "팔로우하기", "Soutenir le projet": "프로젝트 후원", "Revenir à la version précédente": "이전 버전으로 되돌리기", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "베타는 안정판보다 먼저 나와 미리 써 볼 수 있습니다. 오류가 있을 수 있으며, '이전 버전으로 되돌리기'는 계속 쓸 수 있습니다. 언제든 안정판으로 돌아갈 수 있습니다.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "설정 › 업데이트 › 업데이트 채널: 안정판(권장, 기본값) 또는 베타. 베타에서는 시험 버전이 안정판보다 먼저 오며 '사용 가능한 버전'에 '베타'로 표시됩니다. '이전 버전으로 되돌리기'도 계속 쓸 수 있습니다.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "베타는 GitHub 릴리스로 게시되지 않습니다. Prospero Store와 다른 카탈로그에는 안정판만 제공됩니다.", "Installer": "설치", "Téléchargez PPSA99950.zip ci-dessous et décompressez-le : vous obtenez un dossier PPSA99950.": "아래에서 PPSA99950.zip을 내려받아 압축을 풀면 PPSA99950 폴더가 생깁니다.", "Copiez-le dans /data/homebrew/ sur votre PS5 (FTP ou USB).": "이 폴더를 PS5의 /data/homebrew/에 복사합니다(FTP 또는 USB).", "Ouvrez PS5 Backup Center depuis votre lanceur homebrew. L'appli démarre son propre moteur.": "홈브루 런처에서 PS5 Backup Center를 엽니다. 앱이 자체 엔진을 시작합니다.", "Facultatif : {elf} démarre le moteur seul depuis un chargeur d'ELF (port 9021).": "선택 사항: {elf}는 ELF 로더에서 엔진만 시작합니다(포트 9021).", "Il faut une PS5 qui lance déjà des applis homebrew. Déjà installée ? Passez simplement au canal Bêta dans l'appli.": "홈브루 앱을 실행할 수 있는 PS5가 필요합니다. 이미 설치했나요? 앱에서 베타 채널로 바꾸기만 하면 됩니다.", "Fichiers": "파일", "Sommes de contrôle (SHA-256)": "체크섬(SHA-256)"}, "vi": {"PS5 Backup Center 3": "PS5 Backup Center 3", "Stockage dans le nuage (Appareils › Nuage) : Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 ou tout autre service S3, choisis par leur nom ; l'adresse se remplit toute seule.": "Lưu trữ đám mây (Thiết bị › Cloud): Amazon S3, Backblaze B2, Wasabi, Cloudflare R2, Scaleway, OVHcloud, Synology C2 hoặc bất kỳ dịch vụ S3 nào khác, chọn theo tên; địa chỉ tự điền.", "pCloud, Koofr et Nextcloud en WebDAV, préréglés.": "pCloud, Koofr và Nextcloud qua WebDAV, đã cài sẵn.", "Google Drive, OneDrive et Dropbox : chacun connecte son propre compte depuis son téléphone (code QR, connexion chez le service), sans rien taper sur la PS5 ; l'appli n'a accès qu'à son propre dossier. Activation dans une prochaine mise à jour.": "Google Drive, OneDrive và Dropbox: mỗi người tự kết nối tài khoản của mình từ điện thoại (mã QR, đăng nhập tại dịch vụ), không cần gõ gì trên PS5; ứng dụng chỉ truy cập thư mục riêng của nó. Sẽ được bật trong một bản cập nhật sắp tới.", "Un stockage dans le nuage s'utilise comme un NAS (sauvegardes, destination, synchro) ; ses clés se collent depuis le téléphone grâce à un code QR.": "Lưu trữ đám mây dùng như một NAS (sao lưu, đích đến, đồng bộ); khóa của nó được dán từ điện thoại bằng mã QR.", "NAS en WebDAV (Synology, QNAP, Nextcloud…) à côté de FTP et SMB ; le certificat maison du NAS est accepté une fois puis retenu.": "NAS qua WebDAV (Synology, QNAP, Nextcloud…) bên cạnh FTP và SMB; chứng chỉ tự ký của NAS được chấp nhận một lần rồi ghi nhớ.", "« Utilisé pour » : chaque NAS sert aux sauvegardes, à la synchro, ou aux deux ; plusieurs synchros possibles avec le même NAS, chacune dans son dossier.": "“Dùng cho”: mỗi NAS dùng cho sao lưu, đồng bộ, hoặc cả hai; có thể có nhiều đồng bộ với cùng một NAS, mỗi cái trong thư mục riêng.", "Tâches : « Voir la sauvegarde », mettre une sauvegarde à la corbeille, cocher plusieurs tâches.": "Tác vụ: “Xem bản sao lưu”, chuyển một bản sao lưu vào thùng rác, đánh dấu nhiều tác vụ.", "Communauté : « Messages de la communauté », « Laisser un message » et « Suivez-nous » (X, YouTube, Reddit) ; Projets à financer : PS5 Center et sa jauge.": "Cộng đồng: “Lời nhắn của cộng đồng”, “Để lại lời nhắn” và “Theo dõi chúng tôi” (X, YouTube, Reddit); Dự án cần gây quỹ: PS5 Center và thanh tiến độ của nó.", "Clavier complet : caractères spéciaux (R1), majuscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "Bàn phím đầy đủ: ký tự đặc biệt (R1), chữ hoa (L1), é è à ç; mỗi nút hiển thị nút tay cầm tương ứng.", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "NAS qua WebDAV nhanh hơn nhiều; cùng một NAS được thêm bằng hai giao thức chỉ được tính một lần, và các bản sao của nó cho biết đi qua đường nào.", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "Trang chủ: một thẻ Đồng bộ duy nhất lần lượt hiển thị từng thiết bị; “Bản lưu hiện có” chỉ nêu những nơi thực sự có bản lưu.", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "Thư viện: cả hàng bộ lọc vừa trên màn hình; một máy console khác hiện ra ngay trong nháy mắt, với tên rõ ràng (“Tất cả trò chơi của nó”, “Chưa có ở đây”, “Cũng có ở đây”).", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "Bản lưu: Thùng rác luôn hiển thị, thẻ “Bộ nhớ trong” xuất hiện khi có bản sao, có thể xóa nhiều mục đã đánh dấu.", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "Báo lỗi: ba thẻ rõ ràng (một lỗi, một câu hỏi, một ngôi sao) kèm mã của chúng; Cài đặt được sắp xếp lại.", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "Hình thiết bị mới (Cloud, FTP / SMB) cao bằng các hình khác; logo của chúng tôi trên thẻ “Cập nhật”.", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "Khôi phục từ NAS: bản sao lưu đầy đủ đi qua quy trình khôi phục có hướng dẫn.", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS: không còn thư mục “PBC Backup/PBC Backup”; ở thư mục gốc của Synology, bài kiểm tra nhắc chọn một thư mục chia sẻ.", "Sauvegardes : la liste des endroits ne se répète plus sous chaque jeu ; une copie mise à la corbeille disparaît tout de suite.": "Bản lưu: danh sách nơi lưu không còn lặp lại dưới mỗi trò chơi; bản sao chuyển vào thùng rác biến mất ngay.", "Mises à jour : un fichier qui échoue est réessayé une fois ; une version installée mais pas encore active est bien indiquée.": "Cập nhật: tệp bị lỗi được thử lại một lần; phiên bản đã cài nhưng chưa kích hoạt được hiển thị đúng.", "Petits défauts d'affichage corrigés : textes coupés, codes QR de tailles différentes, étiquettes qui se chevauchaient.": "Sửa các lỗi hiển thị nhỏ: chữ bị cắt, mã QR có kích thước khác nhau, nhãn chồng lên nhau.", "Bêta": "Beta", "Canal bêta": "Kênh beta", "Stable (recommandé)": "Ổn định (khuyên dùng)", "Canal des mises à jour": "Kênh cập nhật", "Quoi de neuf": "Có gì mới", "Nouveau": "Mới", "Améliorations": "Cải tiến", "Corrections": "Sửa lỗi", "Toutes les versions": "Tất cả phiên bản", "Signaler un problème": "Báo lỗi", "Suivez-nous": "Theo dõi chúng tôi", "Soutenir le projet": "Ủng hộ dự án", "Revenir à la version précédente": "Quay về phiên bản trước", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Bản beta ra trước bản ổn định để bạn dùng thử. Chúng có thể có lỗi; vẫn có thể “Quay lại phiên b
