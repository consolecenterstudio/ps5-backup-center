juscules (L1), é è à ç ; chaque bouton montre sa touche de manette.": "لوحة مفاتيح كاملة: رموز خاصة (R1)، وأحرف كبيرة (L1)، وé è à ç؛ ويعرض كل زر زر وحدة التحكم المقابل له.", "NAS en WebDAV bien plus rapide ; un même NAS ajouté par deux protocoles n'est compté qu'une fois, et ses copies indiquent leur moyen.": "NAS عبر WebDAV أسرع بكثير؛ ويُحسب NAS نفسه المضاف ببروتوكولين مرة واحدة فقط، وتبيّن نسخه الطريقة المستخدمة.", "Accueil : une seule carte Synchro qui fait défiler chaque appareil ; « Sauvegardes disponibles » ne nomme que les endroits qui en ont vraiment.": "الرئيسية: بطاقة مزامنة واحدة تعرض كل جهاز بالتناوب؛ و«ملفات الحفظ المتاحة» لا تذكر إلا الأماكن التي تحتوي عليها فعلًا.", "Bibliothèque : toute la rangée de filtres tient à l'écran ; une autre console se voit d'un coup d'œil, avec des noms clairs (« Tous ses jeux », « Absents d'ici », « Aussi ici »).": "المكتبة: صف الفلاتر كله يتسع في الشاشة؛ ويظهر جهاز آخر بنظرة واحدة، بأسماء واضحة («كل ألعابها» و«غير موجودة هنا» و«موجود هنا أيضًا»).", "Sauvegardes : la Corbeille reste toujours visible, la carte « Interne » apparaît quand il y a des copies, on peut supprimer plusieurs éléments cochés.": "ملفات الحفظ: سلة المهملات ظاهرة دائمًا، وتظهر بطاقة «داخلي» عند وجود نسخ، ويمكن حذف عدة عناصر محددة.", "Signaler un problème : trois cartes claires (un bug, une question, une étoile) avec leur code ; Paramètres réordonnés.": "الإبلاغ عن مشكلة: ثلاث بطاقات واضحة (خطأ، سؤال، نجمة) مع رمزها؛ وإعادة ترتيب الإعدادات.", "Nouvelles images d'appareils (Nuage, FTP / SMB) à la même hauteur que les autres ; notre logo sur la carte « Mise à jour ».": "صور أجهزة جديدة (السحابة، FTP / SMB) بنفس ارتفاع الصور الأخرى؛ وشعارنا على بطاقة «تحديث».", "Restaurer depuis un NAS : une sauvegarde complète passe par la restauration guidée.": "الاستعادة من NAS: النسخة الاحتياطية الكاملة تمر عبر الاستعادة الموجَّهة.", "NAS : plus de dossier « PBC Backup/PBC Backup » ; à la racine d'un Synology, le test dit de choisir un dossier partagé.": "NAS: لم يعد هناك مجلد «PBC Backup/PBC Backup»؛ وفي جذر Synology يطلب الاختبار اختيار مجلد مشترك.", "Sauvegardes : la liste des endroits ne se répète plus sous chaque jeu ; une copie mise à la corbeille disparaît tout de suite.": "ملفات الحفظ: لم تعد قائمة الأماكن تتكرر تحت كل لعبة؛ والنسخة المنقولة إلى سلة المهملات تختفي فورًا.", "Mises à jour : un fichier qui échoue est réessayé une fois ; une version installée mais pas encore active est bien indiquée.": "التحديثات: يُعاد محاولة الملف الذي يفشل مرة واحدة؛ والإصدار المثبّت غير المفعّل بعد يُعرض بشكل صحيح.", "Petits défauts d'affichage corrigés : textes coupés, codes QR de tailles différentes, étiquettes qui se chevauchaient.": "إصلاح عيوب عرض صغيرة: نصوص مقطوعة، ورموز QR بأحجام مختلفة، وتسميات متداخلة.", "Bêta": "تجريبي", "Canal bêta": "القناة التجريبية", "Stable (recommandé)": "مستقر (موصى به)", "Canal des mises à jour": "قناة التحديثات", "Quoi de neuf": "ما الجديد", "Nouveau": "جديد", "Améliorations": "تحسينات", "Corrections": "إصلاحات", "Toutes les versions": "كل الإصدارات", "Signaler un problème": "الإبلاغ عن مشكلة", "Suivez-nous": "تابعنا", "Soutenir le projet": "دعم المشروع", "Revenir à la version précédente": "العودة إلى الإصدار السابق", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "تصل الإصدارات التجريبية قبل الإصدارات المستقرة لتجربتها. قد تحتوي على أخطاء؛ ويبقى «العودة إلى الإصدار السابق» متاحًا. يمكنك العودة إلى المستقر في أي وقت.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "الإعدادات › التحديثات › قناة التحديثات: مستقر (موصى به، افتراضي) أو تجريبي. في القناة التجريبية تصل الإصدارات التجريبية قبل المستقرة، وتظهر بعلامة «تجريبي» في الإصدارات المتاحة؛ ويبقى «العودة إلى الإصدار السابق» متاحًا.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "لا يُنشر أي إصدار تجريبي كإصدار على GitHub: لا يعرض Prospero Store والكتالوجات الأخرى سوى الإصدارات المستقرة.", "Installer": "تثبيت", "Téléchargez PPSA99950.zip ci-dessous et décompressez-le : vous obtenez un dossier PPSA99950.": "نزّل PPSA99950.zip أدناه وفك ضغطه: ستحصل على مجلد PPSA99950.", "Copiez-le dans /data/homebrew/ sur votre PS5 (FTP ou USB).": "انسخه إلى ‎/data/homebrew/‎ على جهاز PS5 (عبر FTP أو USB).", "Ouvrez PS5 Backup Center depuis votre lanceur homebrew. L'appli démarre son propre moteur.": "افتح PS5 Backup Center من مشغّل التطبيقات المنزلية (homebrew). يشغّل التطبيق محرّكه بنفسه.", "Facultatif : {elf} démarre le moteur seul depuis un chargeur d'ELF (port 9021).": "اختياري: ‎{elf}‎ يشغّل المحرّك وحده من محمّل ELF (المنفذ 9021).", "Il faut une PS5 qui lance déjà des applis homebrew. Déjà installée ? Passez simplement au canal Bêta dans l'appli.": "يتطلب جهاز PS5 يشغّل تطبيقات homebrew مسبقًا. هل هو مثبّت بالفعل؟ ما عليك إلا التبديل إلى قناة بيتا في التطبيق.", "Fichiers": "الملفات", "Sommes de contrôle (SHA-256)": "المجاميع الاختبارية (SHA-256)"}}};
const sel = document.getElementById("lang");
for (const l of D.langs) { const o = document.createElement("option"); o.value = l.code; o.textContent = l.name; sel.append(o); }
function pick() {
  const h = location.hash.slice(1);
  if (D.langs.some(l => l.code === h)) return h;
  for (const n of navigator.languages || [navigator.language || "en"]) {
    const exact = D.langs.find(l => l.code.toLowerCase() === n.toLowerCase());
    if (exact) return exact.code;
    const pre = D.langs.find(l => l.code.split("-")[0] === n.split("-")[0].toLowerCase());
    if (pre) return pre.code;
  }
  return "en";
}
function render(code) {
  const T = D.tr[code] || {}, t = s => T[s] || s, L = D.langs.find(l => l.code === code);
  document.documentElement.lang = code; document.documentElement.dir = L && L.rtl ? "rtl" : "ltr";
  sel.value = code;
  document.getElementById("title").textContent = "PS5 Backup Center " + D.beta;
  document.getElementById("date").textContent = new Date(D.date + "T12:00:00").toLocaleDateString(code, {year: "numeric", month: "long", day: "numeric"});
  document.getElementById("vb").textContent = D.beta; document.getElementById("vs").textContent = D.stable;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  const P = D.page.map(s => t(s).replace("{elf}", D.elf));
  const ol = document.getElementById("install");
  ol.replaceChildren(...P.slice(0, 3).map(s => { const li = document.createElement("li"); li.textContent = s; return li; }));
  document.getElementById("req").textContent = P[3] + " " + P[4];
  document.getElementById("assets-h").textContent = P[5];
  document.getElementById("sums-h").textContent = P[6];
  const fmt = n => new Intl.NumberFormat(code, {maximumFractionDigits: 1}).format(n / 1048576) + " MB";
  document.getElementById("assets").replaceChildren(...D.files.map(f => { const a = document.createElement("a"); a.href = f.url; a.setAttribute("download", ""); const b = document.createElement("b"); b.textContent = f.name; const sp = document.createElement("span"); sp.textContent = f.size > 4096 ? fmt(f.size) : f.size + " B"; a.append(b, sp); return a; }));
  document.getElementById("sums").textContent = D.sums;
  for (const k of ["new", "improved", "fixed"]) {
    const ul = document.getElementById(k); ul.replaceChildren(...D[k].map(s => { const li = document.createElement("li"); li.textContent = t(s); return li; }));
  }
}
sel.onchange = () => { history.replaceState(null, "", "#" + sel.value); render(sel.value); };
window.onhashchange = () => render(pick());
render(pick());
</script>
