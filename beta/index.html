omo un problema; « Ordenar » y « Conservar solo en… » cuando quieras reagrupar.", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "Origen de las partidas restauradas: la copia de una partida restaurada conserva la hora de la partida original, y las dos PS5 lo saben.", "Compresser une image sur le même disque.": "Comprimir una imagen en el mismo disco.", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "Respaldos abiertos en pocos segundos, incluso con varios NAS y nubes; se acabó « servidor ocupado » y los tiempos de espera agotados.", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "Cada copia lleva su huella y el resultado de su lectura: una copia ya leída nunca se vuelve a leer, ni siquiera en la otra PS5, que se entera al instante.", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "Transferencias de juegos más rápidas, reanudables a mitad de los archivos grandes.", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "Respaldos más claros: burbujas ordenadas (En todas partes, Esta PS5, la otra PS5, NAS, Nube, Papelera) con una vista previa de las ocultas, el logo de cada servicio y cada lugar hablando de sus copias.", "Mises à jour : plus jamais de retour en arrière tout seul.": "Actualizaciones: nunca más una vuelta atrás por sí sola.", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "Partidas: etiquetas cortas y nunca cortadas; « No está en esta PS5 » significa que existe una copia, pero no la partida en esta consola.", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "Respaldos: Comparar y ordenar y la Papelera apiladas a la derecha, siempre visibles; los lugares se desplazan a la izquierda.", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "Las ayudas de la parte inferior nunca se cortan (más pequeñas o en dos líneas, en todos los idiomas); « △ Detener la tarea » en lugar de « Cancelar » en Transferencias; « Opciones: acciones » en Comparar.", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "Se acabaron las falsas « copias más recientes » tras una restauración o un ida y vuelta por la nube.", "Connexion OneDrive et création de ses dossiers réparées.": "Conexión a OneDrive y creación de sus carpetas reparadas.", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "Logo de cada servicio desde el inicio (Backblaze ya no aparece primero como nube genérica); al final de una fila, la tarjeta dice « ‹ 2 antes » en lugar de « + 2 más › »; Sincronización cuenta destinos, no dispositivos.", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "Ayudas corregidas: Todas las versiones muestra △ Comparar este juego y R2; la Papelera solo muestra « Izquierda / derecha » en las burbujas; el corazón y la lupa tienen sus propias ayudas; □ cambia de grupo en Tareas; « Abajo: botón Iniciar ».", "Bêta": "Beta", "Canal bêta": "Canal beta", "Stable ( ement sur… » quand on veut regrouper.": "Gleicher Spielstand an mehreren Orten: gewollte Kopien, nie als Problem behandelt; „Aufräumen“ und „Nur behalten auf…“, wenn du zusammenfassen willst.", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "Herkunft wiederhergestellter Spielstände: Die Kopie eines wiederhergestellten Spielstands behält die Zeit des ursprünglichen Spielstands, und beide PS5 wissen es.", "Compresser une image sur le même disque.": "Ein Abbild auf derselben Festplatte komprimieren.", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "Sicherungen öffnen in wenigen Sekunden, auch mit mehreren NAS und Clouds; kein „Server beschäftigt“ und keine Zeitüberschreitung mehr.", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "Jede Kopie trägt ihren Fingerabdruck und das Ergebnis ihrer Auswertung: Eine bereits gelesene Kopie wird nie erneut gelesen, auch nicht von der anderen PS5, die sofort Bescheid bekommt.", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "Schnellere Spielübertragungen, die mitten in großen Dateien fortgesetzt werden.", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "Klarere Sicherungen: geordnete Blasen (Überall, Diese PS5, die andere PS5, NAS, Cloud, Papierkorb) mit Vorschau der verborgenen, das Logo jedes Dienstes, und jeder Ort zeigt seine eigenen Kopien.", "Mises à jour : plus jamais de retour en arrière tout seul.": "Updates: nie mehr ein Zurückspringen von selbst.", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "Spielstände: kurze, nie abgeschnittene Bezeichnungen; „Nicht auf dieser PS5“ heißt, dass eine Kopie existiert, aber nicht der Spielstand auf dieser Konsole.", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "Sicherungen: Vergleichen und sortieren und der Papierkorb rechts übereinander, immer sichtbar; die Orte scrollen links.", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "Tastenhinweise unten werden nie mehr abgeschnitten (kleiner oder zweizeilig, in allen Sprachen); „△ Aufgabe stoppen“ statt „Abbrechen“ in Übertragungen; „Optionen: Aktionen“ in Vergleichen.", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "Keine falschen „neueren Kopien“ mehr nach einer Wiederherstellung oder einem Umweg über die Cloud.", "Connexion OneDrive et création de ses dossiers réparées.": "OneDrive-Anmeldung und Ordnererstellung repariert.", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "Logo jedes Dienstes ab dem Start (Backblaze erscheint nicht mehr zuerst als allgemeine Cloud); am Ende einer Reihe zeigt die Karte „‹ 2 davor“ statt „+ 2 weitere ›“; Synchro zählt Ziele, nicht Geräte.", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "Hinweise korrigiert: Alle Versionen zeigt △ Dieses Spiel vergleichen und R2; der Papierkorb zeigt „Links / rechts“ nur bei den Blasen; Herz und Lupe haben eigene Hinweise; □ wechselt in Aufgaben wirklich die Gruppe; „Unten: Start-Schaltfläche“.", "Bêta": "Beta", "Canal bêta": "Beta-Kanal", "Stable (recommandé)": "Stabil (empfohlen)", "Canal des mises à jour": "Update-Kanal", "Quoi de neuf": "Was ist neu", "Nouveau": "Neu", "Améliorations": "Verbesserungen", "Corrections": "Korrekturen", "Toutes les versions": "Alle Versionen", "Signaler un problème": "Problem melden", "Suivez-nous": "Folge uns", "Soutenir le projet": "Projekt unterstützen", "Revenir à la version précédente": "Zur vorherigen Version zurückkehren", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Betas erscheinen vor den stabilen Versionen, zum Ausprobieren. Sie können Fehler enthalten; „Zur vorherigen Version zurück“ bleibt möglich. Jederzeit zurück zu Stabil.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Einstellungen › Updates › Update-Kanal: Stabil (empfohlen, Standard) oder Beta. Mit Beta kommen Testversionen vor den stabilen, in „Verfügbare Versionen“ als „Beta“ markiert; „Zur vorherigen Version zurück“ bleibt möglich.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Eine Beta wird nie als GitHub-Release veröffentlicht: Prospero Store und andere Kataloge bieten nur stabile Versionen an.", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "Neu hier? Installiere zuerst die stabile Version und wechsle dann in der App auf den Beta-Kanal.", "Installer la version stable": "Stabile Version installieren"}, "it": {"Un centre pour vos jeux et vos sauvegardes, partout": "Un centro per i tuoi giochi e i tuoi backup, ovunque", "Google Drive, OneDrive et Dropbox sont disponibles : chacun connecte son compte depuis son téléphone ; sauvegarde, restauration et synchro comme avec un NAS.": "Google Drive, OneDrive e Dropbox sono disponibili: ognuno collega il proprio account dal telefono; backup, ripristino e sincronizzazione come con un NAS.", "Comparer et trier : toutes les copies d'un jeu côte à côte, jugées par leur contenu (Identique, Plus ancienne, Plus avancée), y compris celles rangées sur l'autre PS5.": "Confronta e ordina: tutte le copie di un gioco una accanto all'altra, giudicate dal contenuto (Identica, Più vecchia, Più avanti), comprese quelle sull'altra PS5.", "Même partie à plusieurs endroits : des copies voulues, jamais traitées comme un problème ; « Faire le tri » et « Garder seulement sur… » quand on veut regrouper.": "Stesso salvataggio in più posti: copie volute, mai trattate come un problema; « Riordina » e « Tieni solo su… » quando vuoi raggruppare.", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "Origine dei salvataggi ripristinati: la copia di un salvataggio ripristinato mantiene l'ora del salvataggio originale, ed entrambe le PS5 lo sanno.", "Compresser une image sur le même disque.": "Comprimere un'immagine sullo stesso disco.", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "Backup aperti in pochi secondi, anche con più NAS e cloud; niente più « server occupato » né timeout.", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "Ogni copia porta la sua impronta e il risultato della lettura: una copia già letta non viene mai riletta, nemmeno dall'altra PS5, che viene avvisata subito.", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "Trasferimenti di giochi più veloci, ripresi a metà dei file grandi.", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "Backup più chiari: bolle in ordine (Ovunque, Questa PS5, l'altra PS5, NAS, Cloud, Cestino) con anteprima di quelle nascoste, il logo di ogni servizio, e ogni posto che parla delle sue copie.", "Mises à jour : plus jamais de retour en arrière tout seul.": "Aggiornamenti: mai più un ritorno indietro da solo.", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "Salvataggi: etichette brevi e mai tagliate; « Non su questa PS5 » significa che esiste una copia, ma non il salvataggio su questa console.", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "Backup: Confronta e ordina e il Cestino impilati a destra, sempre visibili; i posti scorrono a sinistra.", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "I suggerimenti in basso non vengono mai tagliati (più piccoli o su due righe, in tutte le lingue); « △ Ferma l'attività » invece di « Annulla » in Trasferimenti; « Opzioni: azioni » in Confronta.", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "Niente più false « copie più recenti » dopo un ripristino o un andata e ritorno nel cloud.", "Connexion OneDrive et création de ses dossiers réparées.": "Accesso a OneDrive e creazione delle cartelle corretti.", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "Logo di ogni servizio fin dall'avvio (Backblaze non appare più prima come cloud generico); alla fine di una fila la scheda dice « ‹ 2 prima » invece di « + altri 2 › »; la Sincronizzazione conta destinazioni, non dispositivi.", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "Suggerimenti corretti: Tutte le versioni mostra △ Confronta questo gioco e R2; il Cestino mostra « Sinistra / destra » solo sulle bolle; il cuore e la lente hanno i propri suggerimenti; □ cambia davvero gruppo in Attività; « Giù: pulsante Avvia ».", "Bêta": "Beta", "Canal bêta": "Canale beta", "Stable (recommandé)": "Stabile (consigliato)", "Canal des mises à jour": "Canale degli aggiornamenti", "Quoi de neuf": "Novità", "Nouveau": "Nuovo", "Améliorations": "Miglioramenti", "Corrections": "Correzioni", "Toutes les versions": "Tutte le versioni", "Signaler un problème": "Segnala un problema", "Suivez-nous": "Seguici", "Soutenir le projet": "Sostieni il progetto", "Revenir à la version précédente": "Tornare alla versione precedente", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Le beta arrivano prima delle versioni stabili, per provarle. Possono contenere difetti; «Torna alla versione precedente» resta disponibile. Torna a Stabile quando vuoi.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Impostazioni › Aggiornamenti › Canale degli aggiornamenti: Stabile (consigliato, predefinito) o Beta. Con Beta, le versioni di prova arrivano prima di quelle stabili, segnate «beta» in Versioni disponibili; «Torna alla versione precedente» resta disponibile.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Una beta non viene mai pubblicata come versione GitHub: Prospero Store e gli altri cataloghi offrono solo versioni stabili.", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "Sei nuovo? Installa prima la versione stabile, poi passa al canale Beta nell'app.", "Installer la version stable": "Installa la versione stabile"}, "nl": {"Un centre pour vos jeux et vos sauvegardes, partout": "Eén centrum voor je games en back-ups, overal", "Google Drive, OneDrive et Dropbox sont disponibles : chacun connecte son compte depuis son téléphone ; sauvegarde, restauration et synchro comme avec un NAS.": "Google Drive, OneDrive en Dropbox zijn beschikbaar: iedereen koppelt zijn account vanaf de telefoon; back-up, herstel en synchronisatie net als met een NAS.", "Comparer et trier : toutes les copies d'un jeu côte à côte, jugées par leur contenu (Identique, Plus ancienne, Plus avancée), y compris celles rangées sur l'autre PS5.": "Vergelijken en sorteren: alle kopieën van een game naast elkaar, beoordeeld op inhoud (Identiek, Ouder, Verder), ook die op de andere PS5.", "Même partie à plusieurs endroits : des copies voulues, jamais traitées comme un problème ; « Faire le tri » et « Garder seulement sur… » quand on veut regrouper.": "Zelfde opslag op meerdere plekken: gewenste kopieën, nooit als probleem behandeld; „Opruimen” en „Alleen bewaren op…” als je wilt samenvoegen.", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "Herkomst van herstelde opslagen: de kopie van een herstelde opslag houdt de tijd van de oorspronkelijke opslag, en beide PS5's weten het.", "Compresser une image sur le même disque.": "Een image comprimeren op dezelfde schijf.", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "Back-ups openen in een paar seconden, ook met meerdere NAS'en en clouds; geen „server bezet” of time-outs meer.", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "Elke kopie draagt haar vingerafdruk en het resultaat van haar uitlezing: een al gelezen kopie wordt nooit opnieuw gelezen, ook niet door de andere PS5, die meteen wordt ingelicht.", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "Snellere gameoverdrachten die midden in grote bestanden hervatten.", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "Duidelijkere back-ups: bellen op volgorde (Overal, Deze PS5, de andere PS5, NAS, Cloud, Prullenbak) met een voorbeeld van verborgen bellen, het logo van elke dienst, en elke plek die over haar eigen kopieën praat.", "Mises à jour : plus jamais de retour en arrière tout seul.": "Updates: nooit meer vanzelf teruggaan.", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "Opslagen: korte labels die nooit worden afgekapt; „Niet op deze PS5” betekent dat er een kopie is, maar niet de opslag op deze console.", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "Back-ups: Vergelijken en sorteren en de Prullenbak rechts gestapeld, altijd zichtbaar; plekken schuiven links.", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "Knophints onderaan worden nooit afgekapt (kleiner of op twee regels, in elke taal); „△ Taak stoppen” in plaats van „Annuleren” in Overdrachten; „Opties: acties” in Vergelijken.", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "Geen valse „nieuwere kopieën” meer na een herstel of een omweg via de cloud.", "Connexion OneDrive et création de ses dossiers réparées.": "Aanmelden bij OneDrive en mappen aanmaken hersteld.", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "Logo van elke dienst vanaf het begin (Backblaze verschijnt niet meer eerst als algemene cloud); aan het einde van een rij zegt de kaart „‹ 2 ervoor” in plaats van „+ nog 2 ›”; Synchronisatie telt doelen, geen apparaten.", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "Hints verbeterd: Alle versies toont △ Deze game vergelijken en R2; de Prullenbak toont „Links / rechts” alleen bij de bellen; het hart en het vergrootglas hebben eigen hints; □ wisselt echt van groep in Taken; „Omlaag: knop Starten”.", "Bêta": "Bèta", "Canal bêta": "Bètakanaal", "Stable (recommandé)": "Stabiel (aanbevolen)", "Canal des mises à jour": "Updatekanaal", "Quoi de neuf": "Wat is er nieuw", "Nouveau": "Nieuw", "Améliorations": "Verbeteringen", "Corrections": "Oplossingen", "Toutes les versions": "Alle versies", "Signaler un problème": "Een probleem melden", "Suivez-nous": "Volg ons", "Soutenir le projet": "Het project steunen", "Revenir à la version précédente": "Terug naar de vorige versie", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Bèta's komen vóór de stabiele versies, om ze uit te proberen. Ze kunnen fouten bevatten; ‘Terug naar de vorige versie’ blijft mogelijk. Schakel op elk moment terug naar Stabiel.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Instellingen › Updates › Updatekanaal: Stabiel (aanbevolen, standaard) of Bèta. Op Bèta komen testversies vóór de stabiele, gemarkeerd als ‘bèta’ in Beschikbare versies; ‘Terug naar de vorige versie’ blijft mogelijk.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Een bèta wordt nooit als GitHub-release gepubliceerd: Prospero Store en andere catalogi bieden alleen stabiele versies aan.", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "Nieuw? Installeer eerst de stabiele versie en schakel daarna in de app over naar het bètakanaal.", "Installer la version stable": "Stabiele versie installeren"}, "pl": {"Un centre pour vos jeux et vos sauvegardes, partout": "Centrum dla Twoich gier i kopii, wszędzie", "Google Drive, OneDrive et Dropbox sont disponibles : chacun connecte son compte depuis son téléphone ; sauvegarde, restauration et synchro comme avec un NAS.": "Google Drive, OneDrive i Dropbox są dostępne: każdy łączy swoje konto z telefonu; kopia, przywracanie i synchronizacja jak z NAS.", "Comparer et trier : toutes les copies d'un jeu côte à côte, jugées par leur contenu (Identique, Plus ancienne, Plus avancée), y compris celles rangées sur l'autre PS5.": "Porównaj i sortuj: wszystkie kopie gry obok siebie, oceniane po zawartości (Identyczna, Starsza, Dalej), także te na drugiej PS5.", ie etykiety, nigdy ucinane; „Nie ma na tej PS5” oznacza, że kopia istnieje, ale zapisu nie ma na tej konsoli.", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "Kopie: Porównaj i sortuj oraz Kosz ułożone po prawej, zawsze widoczne; miejsca przewijają się po lewej.", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "Podpowiedzi na dole ekranu nigdy nie są ucinane (mniejsze albo w dwóch wierszach, w każdym języku); „△ Zatrzymaj zadanie” zamiast „Anuluj” w Transferach; „Opcje: działania” w Porównaj.", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "Koniec z fałszywymi „nowszymi kopiami” po przywróceniu lub podróży przez chmurę.", "Connexion OneDrive et création de ses dossiers réparées.": "Naprawione logowanie do OneDrive i tworzenie folderów.", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "Logo każdej usługi od startu (Backblaze nie pojawia się już najpierw jako ogólna chmura); na końcu rzędu karta mówi „‹ 2 wcześniej” zamiast „+ 2 więcej ›”; Synchronizacja liczy cele, nie urządzenia.", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "Poprawione podpowiedzi: Wszystkie wersje pokazują △ Porównaj tę grę i R2; Kosz pokazuje „W lewo / w prawo” tylko na bańkach; serce i lupa mają własne podpowiedzi; □ naprawdę zmienia grupę w Zadaniach; „W dół: przycisk Start”.", "Bêta": "Beta", "Canal bêta": "Kanał beta", "Stable (recommandé)": "Stabilny (zalecany)", "Canal des mises à jour": "Kanał aktualizacji", "Quoi de neuf": "Co nowego", "Nouveau": "Nowy", "Améliorations": "Ulepszenia", "Corrections": "Poprawki", "Toutes les versions": "Wszystkie wersje", "Signaler un problème": "Zgłoś problem", "Suivez-nous": "Obserwuj nas", "Soutenir le projet": "Wesprzyj projekt", "Revenir à la version précédente": "Powrót do poprzedniej wersji", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Wersje beta pojawiają się przed stabilnymi, aby można je było wypróbować. Mogą zawierać błędy; „Wróć do poprzedniej wersji” nadal działa. W każdej chwili możesz wrócić do Stabilnego.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Ustawienia › Aktualizacje › Kanał aktualizacji: Stabilny (zalecany, domyślny) lub Beta. W kanale Beta wersje testowe pojawiają się przed stabilnymi, oznaczone jako „beta” w Dostępnych wersjach; „Wróć do poprzedniej wersji” nadal działa.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Wersja beta nigdy nie jest publikowana jako wydanie GitHub: Prospero Store i inne katalogi oferują tylko wersje stabilne.", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "Nowy? Najpierw zainstaluj wersję stabilną, a potem przełącz się w aplikacji na kanał Beta.", "Installer la version stable": "Zainstaluj wersję stabilną"}, "tr": {"Un centre pour vos jeux et vos sauvegardes, partout": "Oyunlarınız ve yedekleriniz için her yerde tek bir merkez", "Google Drive, OneDrive et Dropbox sont disponibles : chacun connecte son compte depuis son téléphone ; sauvegarde, restauration et synchro comme avec un NAS.": "Google Drive, OneDrive ve Dropbox kullanılabilir: herkes hesabını telefonundan bağlar; yedekleme, geri yükleme ve eşitleme bir NAS gibi.", "Comparer et trier : toutes les copies d'un jeu côte à côte, jugées par leur contenu (Identique, Plus ancienne, Plus avancée), y compris celles rangées sur l'autre PS5.": "Karşılaştır ve sırala: bir oyunun tüm kopyaları yan yana, içeriğe göre değerlendirilir (Aynı, Daha eski, Daha ileri), diğer PS5'tekiler dahil.", "Même partie à plusieurs endroits : des copies voulues, jamais traitées comme un problème ; « Faire le tri » et « Garder seulement sur… » quand on veut regrouper.": "Aynı kayıt birçok yerde: istenen kopyalar, asla sorun sayılmaz; toplamak istediğinizde « Düzenle » ve « Yalnızca şurada tut… ».", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "Geri yüklenen kayıtların kökeni: geri yüklenen bir kaydın kopyası özgün kaydın saatini korur ve iki PS5 de bunu bilir.", "Compresser une image sur le même disque.": "Bir görüntüyü aynı diskte sıkıştırma.", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "Yedekler birkaç saniyede açılır, birden çok NAS ve bulutla bile; artık « sunucu meşgul » ya da zaman aşımı yok.", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "Her kopya parmak izini ve okuma sonucunu taşır: okunmuş bir kopya asla yeniden okunmaz, hemen haberdar edilen diğer PS5 tarafından bile.", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "Büyük dosyaların ortasından devam edebilen daha hızlı oyun aktarımları.", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "Daha net Yedekler: sıralı baloncuklar (Her yer, Bu PS5, diğer PS5, NAS, Bulut, Çöp kutusu), gizlenenlerin önizlemesi, her servisin logosu ve her yerin kendi kopyalarından söz etmesi.", "Mises à jour : plus jamais de retour en arrière tout seul.": "Güncellemeler: artık asla kendiliğinden geri dönüş yok.", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "Kayıtlar: kısa ve asla kesilmeyen etiketler; « Bu PS5'te yok », bir kopya olduğu ama kaydın bu konsolda olmadığı anlamına gelir.", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "Yedekler: Karşılaştır ve sırala ile Çöp kutusu sağda üst üste, her zaman görünür; yerler solda kayar.", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "Ekranın altındaki ipuçları asla kesilmez (daha küçük ya da iki satırda, her dilde); Aktarımlar'da « İptal » yerine « △ Görevi durdur »; Karşılaştır'da « Seçenekler: işlemler ».", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "Bir geri yükleme ya da buluttan gidiş dönüşten sonra artık yanlış « daha yeni kopyalar » yok.", "Connexion OneDrive et création de ses dossiers réparées.": "OneDrive girişi ve klasör oluşturma düzeltildi.", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "Her servisin logosu açılıştan itibaren (Backblaze artık önce genel bulut olarak görünmüyor); bir sıranın sonunda kart « + 2 tane daha › » yerine « ‹ önceki 2 » der; Eşitleme cihazları değil hedefleri sayar.", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "İpuçları düzeltildi: Tüm sürümler △ Bu oyunu karşılaştır ve R2'yi gösterir; Çöp kutusu « Sol / sağ »ı yalnızca baloncuklarda gösterir; kalp ve büyüteç kendi ipuçlarına sahip; □ Görevler'de gerçekten grup değiştirir; « Aşağı: Başlat düğmesi ».", "Bêta": "Beta", "Canal bêta": "Beta kanalı", "Stable (recommandé)": "Kararlı (önerilen)", "Canal des mises à jour": "Güncelleme kanalı", "Quoi de neuf": "Yenilikler", "Nouveau": "Yeni", "Améliorations": "İyileştirmeler", "Corrections": "Düzeltmeler", "Toutes les versions": "Tüm sürümler", "Signaler un problème": "Sorun bildir", "Suivez-nous": "Bizi takip edin", "Soutenir le projet": "Projeyi destekle", "Revenir à la version précédente": "Önceki sürüme dön", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Betalar, denemeniz için kararlı sürümlerden önce gelir. Hata içerebilirler; “Önceki sürüme dön” yine kullanılabilir. İstediğiniz zaman Kararlı'ya dönün.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Ayarlar › Güncellemeler › Güncelleme kanalı: Kararlı (önerilen, varsayılan) veya Beta. Beta'da deneme sürümleri kararlı sürümlerden önce gelir ve Mevcut sürümler'de “beta” olarak işaretlenir; “Önceki sürüme dön” yine kullanılabilir.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Bir beta asla GitHub sürümü olarak yayımlanmaz: Prospero Store ve diğer kataloglar yalnızca kararlı sürümleri sunar.", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "Yeni misiniz? Önce kararlı sürümü yükleyin, ardından uygulamada Beta kanalına geçin.", "Installer la version stable": "Kararlı sürümü yükle"}, "ru": {"Un centre pour vos jeux et vos sauvegardes, partout": "Единый центр для ваших игр и копий, везде", "Google Drive, OneDrive et Dropbox sont disponibles : chacun connecte son compte depuis son téléphone ; sauvegarde, restauration et synchro comme avec un NAS.": "Google Drive, OneDrive и Dropbox доступны: каждый подключает свою учётную запись с телефона; копирование, восстановление и синхронизация как с NAS.", "Comparer et trier : toutes les copies d'un jeu côte à côte, jugées par leur contenu (Identique, Plus ancienne, Plus avancée), y compris celles rangées sur l'autre PS5.": "Сравнить и сортировать: все копии игры рядом, оцениваются по содержимому (Идентична, Старее, Дальше), включая копии на другой PS5.", "Même partie à plusieurs endroits : des copies voulues, jamais traitées comme un problème ; « Faire le tri » et « Garder seulement sur… » quand on veut regrouper.": "Одно сохранение в нескольких местах: нужные копии, никогда не считаются проблемой; «Навести порядок» и «Оставить только на…», когда хотите объединить.", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "Происхождение восстановленных сохранений: копия восстановленного сохранения хранит время исходного сохранения, и обе PS5 это знают.", "Compresser une image sur le même disque.": "Сжатие образа на том же диске.", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "Копии открываются за несколько секунд даже с несколькими NAS и облаками; больше никаких «сервер занят» и тайм-аутов.", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "Каждая копия хранит свой отпечаток и результат чтения: прочитанная копия больше не перечитывается, даже другой PS5, которая узнаёт об этом сразу.", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "Более быстрая передача игр с продолжением с середины больших файлов.", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "Более понятные копии: упорядоченные пузыри (Везде, Эта PS5, другая PS5, NAS, Облако, Корзина) с превью скрытых, логотипом каждого сервиса, и каждое место говорит о своих копиях.", "Mises à jour : plus jamais de retour en arrière tout seul.": "Обновления: больше никакого самопроизвольного отката.", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "Сохранения: короткие подписи без обрезки; «Нет на этой PS5» означает, что копия есть, но сохранения на этой консоли нет.", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "Копии: «Сравнить и сортировать» и «Корзина» справа друг над другом, всегда видны; места прокручиваются слева.", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "Подсказки внизу экрана больше не обрезаются (мельче или в две строки, на всех языках); «△ Остановить задачу» вместо «Отмена» в Передачах; «Параметры: действия» в Сравнить.", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "Больше никаких ложных «более новых копий» после восстановления или прохода через облако.", "Connexion OneDrive et création de ses dossiers réparées.": "Исправлены вход в OneDrive и создание папок.", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "Логотип каждого сервиса с запуска (Backblaze больше не показывается сначала как обычное облако); в конце ряда карточка пишет «‹ ещё 2 раньше» вместо «+ ещё 2 ›»; Синхронизация считает цели, а не устройства.", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "Подсказки исправлены: «Все версии» показывают △ «Сравнить эту игру» и R2; Корзина показывает «Влево / вправо» только на пузырях; у сердца и лупы свои подсказки; □ действительно меняет группу в Задачах; «Вниз: кнопка «Запустить»».", "Bêta": "Бета", "Canal bêta": "Бета-канал", "Stable (recommandé)": "Стабильный (рекомендуется)", "Canal des mises à jour": "Канал обновлений", "Quoi de neuf": "Что нового", "Nouveau": "Новый", "Améliorations": "Улучшения", "Corrections": "Исправления", "Toutes les versions": "Все версии", "Signaler un problème": "Сообщить о проблеме", "Suivez-nous": "Подписывайтесь", "Soutenir le projet": "Поддержать проект", "Revenir à la version précédente": "Вернуться к предыдущей версии", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Бета-версии выходят раньше стабильных, чтобы их можно было попробовать. В них могут быть ошибки; «Вернуться к предыдущей версии» остаётся доступным. Вернуться на «Стабильный» можно в любой момент.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Настройки › Обновления › Канал обновлений: «Стабильный» (рекомендуется, по умолчанию) или «Бета». В бета-канале тестовые версии выходят раньше стабильных и помечены «бета» в списке доступных версий; «Вернуться к предыдущей версии» остаётся доступным.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Бета-версия никогда не публикуется как релиз GitHub: Prospero Store и другие каталоги предлагают только стабильные версии.", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "Впервые здесь? Сначала установите стабильную версию, затем переключитесь на бета-канал в приложении.", "Installer la version stable": "Установить стабильную версию"}, "zh-Hans": {"Un centre pour vos jeux et vos sauvegardes, partout": "游戏与备份的中心，无处不在", "Google Drive, OneDrive et Dropbox sont disponibles : chacun connecte son compte depuis son téléphone ; sauvegarde, restauration et synchro comme avec un NAS.": "Google Drive、OneDrive 和 Dropbox 已可用：各自用手机连接自己的账户；备份、恢复和同步就像使用 NAS 一样。", "Comparer et trier : toutes les copies d'un jeu côte à côte, jugées par leur contenu (Identique, Plus ancienne, Plus avancée), y compris celles rangées sur l'autre PS5.": "比较与整理：一个游戏的所有副本并排显示，按内容判断（相同、较旧、更靠后），包括存放在另一台 PS5 上的副本。", "Même partie à plusieurs endroits : des copies voulues, jamais traitées comme un problème ; « Faire le tri » et « Garder seulement sur… » quand on veut regrouper.": "同一存档在多个位置：是想要的副本，绝不当作问题；想要合并时可用「整理」和「只保留在…」。", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "恢复存档的来源：恢复后的存档副本保留原始存档的时间，两台 PS5 都知道。", "Compresser une image sur le même disque.": "在同一磁盘上压缩镜像。", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "备份几秒内打开，即使有多个 NAS 和云端；不再出现「服务器忙」或超时。", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "每份副本都带有指纹和读取结果：读取过的副本不会再读，另一台 PS5 也不会，并会立即收到通知。", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "更快的游戏传输，可在大文件中途继续。", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "更清楚的备份：气泡按顺序排列（全部、这台 PS5、另一台 PS5、NAS、云、回收站），预览被隐藏的气泡，显示每个服务的标志，每个位置只说自己的副本。", "Mises à jour : plus jamais de retour en arrière tout seul.": "更新：再也不会自行回退。", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "存档：标签简短且不再被截断；「不在这台 PS5 上」表示有副本，但这台主机上没有该存档。", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "备份：「比较与整理」和「回收站」叠放在右侧，始终可见；位置在左侧滚动。", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "屏幕底部的按键提示不再被截断（缩小或分两行，所有语言）；传输中「△ 停止任务」取代「取消」；比较中为「选项：操作」。", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "恢复或经云端往返后，不再出现错误的「较新副本」。", "Connexion OneDrive et création de ses dossiers réparées.": "修复 OneDrive 登录和文件夹创建。", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "启动时即显示每个服务的标志（Backblaze 不再先显示为通用云）；到达一行末尾时，卡片显示「‹ 之前 2 个」而不是「+ 另外 2 个 ›」；同步统计的是目标，而不是设备。", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "提示已更正：「所有版本」显示 △ 比较此游戏和 R2；回收站只在气泡上显示「左 / 右」；爱心和放大镜有各自的提示；□ 在任务中确实切换分组；「下：启动按钮」。", "Bêta": "测试版", "Canal bêta": "测试版渠道", "Stable (recommandé)": "稳定版（推荐）", "Canal des mises à jour": "更新渠道", "Quoi de neuf": "新功能", "Nouveau": "新建", "Améliorations": "改进", "Corrections": "修复", "Toutes les versions": "所有版本", "Signaler un problème": "报告问题", "Suivez-nous": "关注我们", "Soutenir le projet": "支持本项目", "Revenir à la version précédente": "回到上一个版本", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "测试版会先于稳定版推出，方便抢先试用。它们可能存在问题；仍可“回到上一个版本”。随时可以切换回稳定版。", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "设置 › 更新 › 更新渠道：稳定版（推荐，默认）或测试版。选择测试版后，测试版本会先于稳定版推出，并在“可用版本”中标为“测试版”；仍可“回到上一个版本”。", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "测试版从不作为 GitHub 版本发布：Prospero Store 和其他目录只提供稳定版。", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "第一次使用？请先安装稳定版，然后在应用中切换到测试版通道。", "Installer la version stable": "安装稳定版"}, "zh-Hant": {"Un centre pour vos jeux et vos sauvegardes, partout": "遊戲與備份的中心，無所不在", "Google Drive, OneDrive et Dropbox sont disponibles : chacun connecte son compte depuis son téléphone ; sauvegarde, restauration et synchro comme avec un NAS.": "Google Drive、OneDrive 和 Dropbox 已可用：各自用手機連接自己的帳戶；備份、還原和同步就像使用 NAS 一樣。", "Comparer et trier : toutes les copies d'un jeu côte à côte, jugées par leur contenu (Identique, Plus ancienne, Plus avancée), y compris celles rangées sur l'autre PS5.": "比較與整理：一個遊戲的所有副本並排顯示，依內容判斷（相同、較舊、更靠後），包括存放在另一台 PS5 上的副本。", "Même partie à plusieurs endroits : des copies voulues, jamais traitées comme un problème ; « Faire le tri » et « Garder seulement sur… » quand on veut regrouper.": "同一存檔在多個位置：是想要的副本，絕不當作問題；想要合併時可用「整理」和「只保留在…」。", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "還原存檔的來源：還原後的存檔副本保留原始存檔的時間，兩台 PS5 都知道。", "Compresser une image sur le même disque.": "在同一磁碟上壓縮映像。", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "備份幾秒內開啟，即使有多個 NAS 和雲端；不再出現「伺服器忙碌」或逾時。", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "每份副本都帶有指紋和讀取結果：讀取過的副本不會再讀，另一台 PS5 也不會，並會立即收到通知。", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "更快的遊戲傳輸，可在大檔案中途繼續。", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "更清楚的備份：泡泡依序排列（全部、這台 PS5、另一台 PS5、NAS、雲端、資源回收筒），預覽被隱藏的泡泡，顯示每個服務的標誌，每個位置只說自己的副本。", "Mises à jour : plus jamais de retour en arrière tout seul.": "更新：再也不會自行退回。", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "存檔：標籤簡短且不再被截斷；「不在這台 PS5 上」表示有副本，但這台主機上沒有該存檔。", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "備份：「比較與整理」和「資源回收筒」疊放在右側，始終可見；位置在左側捲動。", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "畫面底部的按鍵提示不再被截斷（縮小或分兩行，所有語言）；傳輸中「△ 停止任務」取代「取消」；比較中為「選項：動作」。", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "還原或經雲端往返後，不再出現錯誤的「較新副本」。", "Connexion OneDrive et création de ses dossiers réparées.": "修正 OneDrive 登入和資料夾建立。", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "啟動時即顯示每個服務的標誌（Backblaze 不再先顯示為通用雲端）；到達一列末尾時，卡片顯示「‹ 之前 2 個」而不是「+ 另外 2 個 ›」；同步統計的是目標，而不是裝置。", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "提示已更正：「所有版本」顯示 △ 比較此遊戲和 R2；資源回收筒只在泡泡上顯示「左 / 右」；愛心和放大鏡有各自的提示；□ 在工作中確實切換群組；「下：啟動按鈕」。", "Bêta": "測試版", "Canal bêta": "測試版頻道", "Stable (recommandé)": "穩定版（建議）", "Canal des mises à jour": "更新頻道", "Quoi de neuf": "新功能", "Nouveau": "新增", "Améliorations": "改進", "Corrections": "修正", "Toutes les versions": "所有版本", "Signaler un problème": "回報問題", "Suivez-nous": "追蹤我們", "Soutenir le projet": "支持本專案", "Revenir à la version précédente": "回到上一個版本", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "測試版會先於穩定版推出，方便搶先試用。可能存在問題；仍可「回到上一個版本」。隨時可以切換回穩定版。", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "設定 › 更新 › 更新頻道：穩定版（建議，預設）或測試版。選擇測試版後，測試版本會先於穩定版推出，並在「可用版本」中標示為「測試版」；仍可「回到上一個版本」。", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "測試版從不以 GitHub 版本發布：Prospero Store 與其他目錄只提供穩定版。", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "第一次使用？請先安裝穩定版，然後在應用程式中切換到測試版頻道。", "Installer la version stable": "安裝穩定版"}, "ja": {"Un centre pour vos jeux et vos sauvegardes, partout": "ゲームとバックアップのハブを、どこにでも", "Google Drive, OneDrive et Dropbox sont disponibles : chacun connecte son compte depuis son téléphone ; sauvegarde, restauration et synchro comme avec un NAS.": "Google Drive、OneDrive、Dropbox が使えます。各自がスマホから自分のアカウントを接続し、NAS と同じようにバックアップ、復元、同期ができます。", "Comparer et trier : toutes les copies d'un jeu côte à côte, jugées par leur contenu (Identique, Plus ancienne, Plus avancée), y compris celles rangées sur l'autre PS5.": "比較と整理：ゲームのすべてのコピーを並べて内容で判定（同一・古い・進んでいる）。もう一台の PS5 にあるコピーも含みます。", "Même partie à plusieurs endroits : des copies voulues, jamais traitées comme un problème ; « Faire le tri » et « Garder seulement sur… » quand on veut regrouper.": "同じセーブを複数の場所に：望んだコピーで、問題扱いしません。まとめたいときは「整理する」と「次の場所だけに残す…」。", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "復元したセーブの由来：復元したセーブのコピーは元のセーブの時刻を保ち、2 台の PS5 がそれを共有します。", "Compresser une image sur le même disque.": "同じディスクでイメージを圧縮。", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "バックアップが数秒で開きます。複数の NAS やクラウドがあっても「サーバーが混雑」やタイムアウトはもうありません。", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "各コピーが指紋と読み取り結果を持ちます。読み取り済みのコピーは、すぐに知らせを受けるもう一台の PS5 でも読み直しません。", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "大きなファイルの途中から再開できる、より速いゲーム転送。", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "わかりやすいバックアップ：並んだバブル（すべて、この PS5、もう一台の PS5、NAS、クラウド、ゴミ箱）、隠れたバブルのプレビュー、各サービスのロゴ、場所ごとのコピー表示。", "Mises à jour : plus jamais de retour en arrière tout seul.": "アップデート：勝手に元のバージョンに戻ることはもうありません。", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "セーブ：ラベルを短くし、切れないようにしました。「この PS5 にはない」は、コピーはあるがこの本体にセーブがないという意味です。", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "バックアップ：「比較と整理」と「ゴミ箱」を右側に重ねて常に表示。場所は左側でスクロールします。", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "画面下のボタン案内が切れなくなりました（小さく、または 2 行で、すべての言語）。転送では「キャンセル」ではなく「△ タスクを停止」、比較では「オプション：操作」。", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "復元やクラウド経由の往復のあとに、誤った「新しいコピー」が出なくなりました。", "Connexion OneDrive et création de ses dossiers réparées.": "OneDrive のサインインとフォルダー作成を修正。", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "起動時から各サービスのロゴを表示（Backblaze が最初に一般的なクラウドとして表示されなくなりました）。列の最後ではカードが「ほか 2 件 ›」ではなく「‹ 前の 2 件」と表示。同期はデバイスではなく同期先を数えます。", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "案内を修正：「すべてのバージョン」に △ このゲームを比較 と R2 を表示。ゴミ箱は「左 / 右」をバブルでのみ表示。ハートと虫めがねに専用の案内。タスクで □ が実際にグループを切り替え。「下：開始ボタン」。", "Bêta": "ベータ", "Canal bêta": "ベータチャンネル", "Stable (recommandé)": "安定版（推奨）", "Canal des mises à jour": "アップデートチャンネル", "Quoi de neuf": "新機能", "Nouveau": "新規", "Améliorations": "改善", "Corrections": "修正", "Toutes les versions": "すべてのバージョン", "Signaler un problème": "問題を報告", "Suivez-nous": "フォローする", "Soutenir le projet": "プロジェクトを支援", "Revenir à la version précédente": "前のバージョンに戻す", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "ベータ版は安定版より先に公開され、いち早く試せます。不具合を含む場合があります。「前のバージョンに戻す」は引き続き使えます。いつでも安定版に戻せます。", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "設定 › アップデート › アップデートチャンネル：安定版（推奨・既定）またはベータ。ベータでは試験版が安定版より先に届き、「利用できるバージョン」に「ベータ」と表示されます。「前のバージョンに戻す」も引き続き使えます。", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "ベータ版が GitHub のリリースとして公開されることはありません。Prospero Store などのカタログには安定版だけが並びます。", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "初めての方は、まず安定版をインストールし、アプリでベータチャンネルに切り替えてください。", "Installer la version stable": "安定版をインストール"}, "ko": {"Un centre pour vos jeux et vos sauvegardes, partout": "어디서나 게임과 백업을 위한 하나의 허브", "Google Drive, OneDrive et Dropbox sont disponibles : chacun connecte son compte depuis son téléphone ; sauvegarde, restauration et synchro comme avec un NAS.": "Google Drive, OneDrive, Dropbox를 사용할 수 있습니다. 각자 휴대폰에서 계정을 연결하고, NAS처럼 백업, 복원, 동기화합니다.", "Comparer et trier : toutes les copies d'un jeu côte à côte, jugées par leur contenu (Identique, Plus ancienne, Plus avancée), y compris celles rangées sur l'autre PS5.": "비교 및 정리: 게임의 모든 사본을 나란히, 내용으로 판정합니다(동일, 더 오래됨, 더 진행됨). 다른 PS5에 있는 사본도 포함합니다.", "Même partie à plusieurs endroits : des copies voulues, jamais traitées comme un problème ; « Faire le tri » et « Garder seulement sur… » quand on veut regrouper.": "같은 세이브를 여러 곳에: 원하는 사본이며 문제로 취급하지 않습니다. 모으고 싶을 때 « 정리하기 »와 « 여기에만 보관… ».", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "복원한 세이브의 출처: 복원한 세이브의 사본은 원래 세이브 시간을 유지하고, 두 PS5가 이를 압니다.", "Compresser une image sur le même disque.": "같은 디스크에서 이미지 압축.", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "여러 NAS와 클라우드가 있어도 백업이 몇 초 만에 열립니다. « 서버 사용 중 »이나 시간 초과는 이제 없습니다.", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "각 사본은 지문과 읽은 결과를 가집니다. 이미 읽은 사본은 바로 알림을 받는 다른 PS5에서도 다시 읽지 않습니다.", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "큰 파일 중간부터 이어지는 더 빠른 게임 전송.", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "더 명확한 백업: 순서대로 정렬된 버블(전체, 이 PS5, 다른 PS5, NAS, 클라우드, 휴지통), 숨은 버블 미리 보기, 서비스별 로고, 장소마다 자기 사본 표시.", "Mises à jour : plus jamais de retour en arrière tout seul.": "업데이트: 이제 저절로 되돌아가지 않습니다.", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "세이브: 짧고 잘리지 않는 표시. « 이 PS5에 없음 »은 사본은 있지만 이 콘솔에 세이브가 없다는 뜻입니다.", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "백업: « 비교 및 정리 »와 « 휴지통 »을 오른쪽에 위아래로 항상 표시, 장소는 왼쪽에서 스크롤됩니다.", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "화면 아래 버튼 안내가 잘리지 않습니다(작게 또는 두 줄로, 모든 언어). 전송에서 « 취소 » 대신 « △ 작업 중지 », 비교에서 « 옵션: 동작 ».", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "복원이나 클라우드 왕복 후 잘못된 « 더 최근 사본 »이 더 이상 나오지 않습니다.", "Connexion OneDrive et création de ses dossiers réparées.": "OneDrive 로그인과 폴더 생성을 수정했습니다.", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "시작부터 서비스별 로고 표시(Backblaze가 더 이상 일반 클라우드로 먼저 나오지 않음). 줄 끝에서는 카드가 « + 2개 더 › » 대신 « ‹ 이전 2개 »라고 표시. 동기화는 기기가 아니라 대상을 셉니다.", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "안내 수정: 모든 버전에 △ 이 게임 비교와 R2 표시, 휴지통은 버블에서만 « 왼쪽 / 오른쪽 » 표시, 하트와 돋보기에 자체 안내, 작업에서 □가 실제로 그룹 전환, « 아래: 시작 버튼 ».", "Bêta": "베타", "Canal bêta": "베타 채널", "Stable (recommandé)": "안정판 (권장)", "Canal des mises à jour": "업데이트 채널", "Quoi de neuf": "새로운 기능", "Nouveau": "새로 만들기", "Améliorations": "개선 사항", "Corrections": "수정 사항", "Toutes les versions": "모든 버전", "Signaler un problème": "문제 신고", "Suivez-nous": "팔로우하기", "Soutenir le projet": "프로젝트 후원", "Revenir à la version précédente": "이전 버전으로 되돌리기", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "베타는 안정판보다 먼저 나와 미리 써 볼 수 있습니다. 오류가 있을 수 있으며, '이전 버전으로 되돌리기'는 계속 쓸 수 있습니다. 언제든 안정판으로 돌아갈 수 있습니다.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "설정 › 업데이트 › 업데이트 채널: 안정판(권장, 기본값) 또는 베타. 베타에서는 시험 버전이 안정판보다 먼저 오며 '사용 가능한 버전'에 '베타'로 표시됩니다. '이전 버전으로 되돌리기'도 계속 쓸 수 있습니다.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "베타는 GitHub 릴리스로 게시되지 않습니다. Prospero Store와 다른 카탈로그에는 안정판만 제공됩니다.", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "처음이신가요? 먼저 안정 버전을 설치한 다음 앱에서 베타 채널로 바꾸세요.", "Installer la version stable": "안정 버전 설치"}, "vi": {"Un centre pour vos jeux et vos sauvegardes, partout": "Trung tâm cho trò chơi và bản sao lưu của bạn, ở mọi nơi", "Google Drive, OneDrive et Dropbox sont disponibles : chacun connecte son compte depuis son téléphone ; sauvegarde, restauration et synchro comme avec un NAS.": "Google Drive, OneDrive và Dropbox đã có: mỗi người kết nối tài khoản từ điện thoại; sao lưu, khôi phục và đồng bộ như với NAS.", "Comparer et trier : toutes les copies d'un jeu côte à côte, jugées par leur contenu (Identique, Plus ancienne, Plus avancée), y compris celles rangées sur l'autre PS5.": "So sánh và sắp xếp: mọi bản sao của một trò chơi đặt cạnh nhau, đánh giá theo nội dung (Giống hệt, Cũ hơn, Tiến xa hơn), kể cả các bản trên PS5 kia.", "Même partie à plusieurs endroits : des copies voulues, jamais traitées comme un problème ; « Faire le tri » et « Garder seulement sur… » quand on veut regrouper.": "Cùng bản lưu ở nhiều nơi: bản sao mong muốn, không bao giờ bị coi là vấn đề; « Sắp xếp gọn » và « Chỉ giữ trên… » khi bạn muốn gom lại.", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "Nguồn gốc bản lưu đã khôi phục: bản sao của một bản lưu đã khôi phục giữ thời gian của bản lưu gốc, và cả hai PS5 đều biết.", "Compresser une image sur le même disque.": "Nén ảnh đĩa trên cùng ổ.", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "Sao lưu mở trong vài giây, kể cả với nhiều NAS và đám mây; không còn « máy chủ bận » hay hết thời gian chờ.", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "Mỗi bản sao mang dấu vân tay và kết quả đọc của nó: bản sao đã đọc không bao giờ bị đọc lại, kể cả trên PS5 kia, máy được báo ngay.", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "Chuyển trò chơi nhanh hơn, tiếp tục được giữa chừng các tệp lớn.", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "Sao lưu rõ ràng hơn: các bong bóng theo thứ tự (Mọi nơi, PS5 này, PS5 kia, NAS, Đám mây, Thùng rác), xem trước các bong bóng ẩn, logo từng dịch vụ, và mỗi nơi nói về bản sao của nó.", "Mises à jour : plus jamais de retour en arrière tout seul.": "Cập nhật: không bao giờ tự quay lại phiên bản cũ nữa.", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "Bản lưu: nhãn ngắn và không bao giờ bị cắt; « Không có trên PS5 này » nghĩa là có bản sao, nhưng bản lưu không có trên máy này.", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "Sao lưu: So sánh và sắp xếp cùng Thùng rác xếp chồng bên phải, luôn hiển thị; các nơi cuộn bên trái.", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "Gợi ý nút ở cuối màn hình không bao giờ bị cắt (nhỏ hơn hoặc hai dòng, mọi ngôn ngữ); « △ Dừng tác vụ » thay cho « Hủy » trong Chuyển; « Tùy chọn: thao tác » trong So sánh.", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "Không còn « bản sao mới hơn » sai sau khi khôi phục hoặc đi vòng qua đám mây.", "Connexion OneDrive et création de ses dossiers réparées.": "Sửa lỗi đăng nhập OneDrive và tạo thư mục.", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "Logo từng dịch vụ ngay từ khi khởi động (Backblaze không còn hiện đám mây chung trước); ở cuối một hàng, thẻ ghi « ‹ 2 mục trước » thay vì « + 2 mục nữa › »; Đồng bộ đếm đích, không phải thiết bị.", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "Sửa gợi ý: Tất cả phiên bản hiện △ So sánh trò chơi này và R2; Thùng rác chỉ hiện « Trái / phải » trên bong bóng; trái tim và kính lúp có gợi ý riêng; □ thật sự đổi nhóm trong Tác vụ; « Xuống: nút Bắt đầu ».", "Bêta": "Beta", "Canal bêta": "Kênh beta", "Stable (recommandé)": "Ổn định (khuyên dùng)", "Canal des mises à jour": "Kênh cập nhật", "Quoi de neuf": "Có gì mới", "Nouveau": "Mới", "Améliorations": "Cải tiến", "Corrections": "Sửa lỗi", "Toutes les versions": "Tất cả phiên bản", "Signaler un problème": "Báo lỗi", "Suivez-nous": "Theo dõi chúng tôi", "Soutenir le projet": "Ủng hộ dự án", "Revenir à la version précédente": "Quay về phiên bản trước", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "Bản beta ra trước bản ổn định để bạn dùng thử. Chúng có thể có lỗi; vẫn có thể “Quay lại phiên bản trước”. Chuyển về Ổn định bất cứ lúc nào.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "Cài đặt › Cập nhật › Kênh cập nhật: Ổn định (khuyên dùng, mặc định) hoặc Beta. Ở kênh Beta, bản thử nghiệm đến trước bản ổn định, được đánh dấu “beta” trong Các phiên bản có sẵn; vẫn có thể “Quay lại phiên bản trước”.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "Bản beta không bao giờ được phát hành dưới dạng bản GitHub: Prospero Store và các danh mục khác chỉ cung cấp bản ổn định.", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "Bạn mới dùng? Hãy cài bản ổn định trước, rồi chuyển sang kênh Beta trong ứng dụng.", "Installer la version stable": "Cài bản ổn định"}, "ar": {"Un centre pour vos jeux et vos sauvegardes, partout": "مركز واحد لألعابك ونسخك الاحتياطية، في كل مكان", "Google Drive, OneDrive et Dropbox sont disponibles : chacun connecte son compte depuis son téléphone ; sauvegarde, restauration et synchro comme avec un NAS.": "Google Drive وOneDrive وDropbox متاحة: يربط كل شخص حسابه من هاتفه؛ نسخ احتياطي واستعادة ومزامنة كما مع NAS.", "Comparer et trier : toutes les copies d'un jeu côte à côte, jugées par leur contenu (Identique, Plus ancienne, Plus avancée), y compris celles rangées sur l'autre PS5.": "قارن ورتّب: كل نسخ اللعبة جنبًا إلى جنب، تُقيَّم حسب المحتوى (مطابقة، أقدم، أكثر تقدمًا)، بما فيها النسخ المحفوظة على جهاز PS5 الآخر.", "Même partie à plusieurs endroits : des copies voulues, jamais traitées comme un problème ; « Faire le tri » et « Garder seulement sur… » quand on veut regrouper.": "الحفظ نفسه في عدة أماكن: نسخ مقصودة، لا تُعامل أبدًا كمشكلة؛ « ترتيب » و« الإبقاء فقط على… » عندما تريد التجميع.", "Origine des parties restaurées : la copie d'une partie restaurée garde l'heure de la partie d'origine, et les deux PS5 le savent.": "مصدر الحفظات المستعادة: تحتفظ نسخة الحفظ المستعاد بوقت الحفظ الأصلي، ويعرف ذلك جهازا PS5.", "Compresser une image sur le même disque.": "ضغط صورة على القرص نفسه.", "Sauvegardes ouvertes en quelques secondes, même avec plusieurs NAS et nuages ; plus de « serveur occupé » ni de délai dépassé.": "تُفتح النسخ الاحتياطية في ثوانٍ، حتى مع عدة أجهزة NAS وخدمات سحابية؛ لا مزيد من « الخادم مشغول » أو انتهاء المهلة.", "Chaque copie porte son empreinte et le résultat de sa lecture : une copie déjà lue n'est jamais relue, même par l'autre PS5, qui est prévenue tout de suite.": "تحمل كل نسخة بصمتها ونتيجة قراءتها: لا تُعاد قراءة نسخة مقروءة أبدًا، حتى على جهاز PS5 الآخر الذي يُبلَّغ فورًا.", "Transferts de jeux plus rapides, reprenables au milieu des gros fichiers.": "نقل أسرع للألعاب يُستأنف من منتصف الملفات الكبيرة.", "Sauvegardes plus claires : bulles rangées (Partout, Cette PS5, l'autre PS5, NAS, Nuage, Corbeille) avec un aperçu de celles cachées, le logo de chaque service, et chaque endroit qui parle de ses copies.": "نسخ احتياطية أوضح: فقاعات مرتبة (في كل مكان، جهاز PS5 هذا، جهاز PS5 الآخر، NAS، السحابة، سلة المهملات) مع معاينة المخفية، وشعار كل خدمة، وكل مكان يتحدث عن نسخه.", "Mises à jour : plus jamais de retour en arrière tout seul.": "التحديثات: لا رجوع تلقائي بعد الآن.", "Parties : étiquettes courtes et jamais coupées ; « Pas sur cette PS5 » veut dire qu'une copie existe, mais pas la partie sur cette console.": "الحفظات: تسميات قصيرة لا تُقطع أبدًا؛ « ليست على جهاز PS5 هذا » تعني أن هناك نسخة، لكن الحفظ غير موجود على هذا الجهاز.", "Sauvegardes : Comparer et trier et la Corbeille empilés à droite, toujours visibles ; les endroits défilent à gauche.": "النسخ الاحتياطية: « قارن ورتّب » و« سلة المهملات » فوق بعضهما على اليمين، ظاهرتان دائمًا؛ وتتمرر الأماكن على اليسار.", "Aides du bas de l'écran jamais coupées (plus petites, sinon sur deux lignes, dans toutes les langues) ; « △ Arrêter la tâche » au lieu de « Annuler » dans Transferts ; « Options : actions » dans Comparer.": "لم تعد تلميحات الأزرار أسفل الشاشة مقطوعة (أصغر أو على سطرين، بكل اللغات)؛ « △ إيقاف المهمة » بدل « إلغاء » في النقل؛ « الخيارات: إجراءات » في المقارنة.", "Plus de fausses « copies plus récentes » après une restauration ou un aller-retour par le nuage.": "لا مزيد من « النسخ الأحدث » الخاطئة بعد استعادة أو ذهاب وإياب عبر السحابة.", "Connexion OneDrive et création de ses dossiers réparées.": "إصلاح تسجيل الدخول إلى OneDrive وإنشاء المجلدات.", "Logo de chaque service dès le démarrage (Backblaze n'apparaît plus d'abord en nuage générique) ; arrivé au bout d'une rangée, la carte dit « ‹ 2 avant » au lieu de « + 2 de plus › » ; Synchro compte des cibles, pas des appareils.": "شعار كل خدمة منذ البدء (لم يعد Backblaze يظهر أولًا كسحابة عامة)؛ في نهاية الصف تقول البطاقة « ‹ 2 سابقة » بدل « + 2 أخرى › »؛ المزامنة تعدّ الأهداف لا الأجهزة.", "Aides corrigées : Toutes les versions annonce △ Comparer ce jeu et R2 ; la Corbeille n'affiche « Gauche / droite » que sur les bulles ; le cœur et la loupe ont leurs propres aides ; □ change bien de groupe dans Tâches ; « Bas : bouton Lancer ».": "تصحيح التلميحات: « كل الإصدارات » يعرض △ قارن هذه اللعبة وR2؛ سلة المهملات تعرض « يسار / يمين » على الفقاعات فقط؛ للقلب والعدسة تلميحاتهما؛ □ يغيّر المجموعة فعلًا في المهام؛ « أسفل: زر البدء ».", "Bêta": "تجريبي", "Canal bêta": "القناة التجريبية", "Stable (recommandé)": "مستقر (موصى به)", "Canal des mises à jour": "قناة التحديثات", "Quoi de neuf": "ما الجديد", "Nouveau": "جديد", "Améliorations": "تحسينات", "Corrections": "إصلاحات", "Toutes les versions": "كل الإصدارات", "Signaler un problème": "الإبلاغ عن مشكلة", "Suivez-nous": "تابعنا", "Soutenir le projet": "دعم المشروع", "Revenir à la version précédente": "العودة إلى الإصدار السابق", "Les bêtas arrivent avant les versions stables, pour les essayer. Elles peuvent contenir des défauts ; « Revenir à la version d'avant » reste possible. Repassez en Stable à tout moment.": "تصل الإصدارات التجريبية قبل الإصدارات المستقرة لتجربتها. قد تحتوي على أخطاء؛ ويبقى «العودة إلى الإصدار السابق» متاحًا. يمكنك العودة إلى المستقر في أي وقت.", "Paramètres › Mises à jour › Canal des mises à jour : Stable (recommandé, par défaut) ou Bêta. Sur Bêta, les versions d'essai arrivent avant les stables, marquées « bêta » dans Versions disponibles ; « Revenir à la version d'avant » reste possible.": "الإعدادات › التحديثات › قناة التحديثات: مستقر (موصى به، افتراضي) أو تجريبي. في القناة التجريبية تصل الإصدارات التجريبية قبل المستقرة، وتظهر بعلامة «تجريبي» في الإصدارات المتاحة؛ ويبقى «العودة إلى الإصدار السابق» متاحًا.", "Une bêta n'est jamais publiée comme version GitHub : Prospero Store et les autres catalogues ne proposent que les versions stables.": "لا يُنشر أي إصدار تجريبي كإصدار على GitHub: لا يعرض Prospero Store والكتالوجات الأخرى سوى الإصدارات المستقرة.", "Nouveau ? Installez d'abord la version stable, puis passez au canal Bêta dans l'appli.": "جديد هنا؟ ثبّت الإصدار المستقر أولًا، ثم انتقل إلى قناة بيتا في التطبيق.", "Installer la version stable": "تثبيت الإصدار المستقر"}}};
const sel = document.getElementById("lang");
for (const l of D.langs) { const o = document.createElement("option"); o.value = l.code; o.textContent = l.name; sel.append(o); }
function pick() {
  const h = location.hash.slice(1);
  if (D.langs.some(l => l.code === h)) return h;
  for (const n of navigator.languages || [navigator.language || "en"]) {
    const exact = D.langs.find(l => l.code.toLowerCase() === n.toLowerCase());
    if (exact) return exact.code;
    const pre = D.langs.find(l => l.code.split("-")[0] === n.split("-")[0].toLowerCase());
    if (pre) return pre.code;
  }
  return "en";
}
function render(code) {
  const T = D.tr[code] || {}, t = s => T[s] || s, L = D.langs.find(l => l.code === code);
  document.documentElement.lang = code; document.documentElement.dir = L && L.rtl ? "rtl" : "ltr";
  sel.value = code;
  document.getElementById("title").textContent = "PS5 Backup Center " + D.beta;
  document.getElementById("date").textContent = new Date(D.date + "T12:00:00").toLocaleDateString(code, {year: "numeric", month: "long", day: "numeric"});
  document.getElementById("vb").textContent = D.beta; document.getElementById("vs").textContent = D.stable;
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = t(e.dataset.t));
  const P = D.page.map(t);
  document.getElementById("newbie").textContent = P[0];
  document.getElementById("stable-link").textContent = P[1] + " (" + D.stable + ")";
  for (const k of ["new", "improved", "fixed"]) {
    const ul = document.getElementById(k); ul.replaceChildren(...D[k].map(s => { const li = document.createElement("li"); li.textContent = t(s); return li; }));
  }
}
sel.onchange = () => { history.replaceState(null, "", "#" + sel.value); render(sel.value); };
window.onhashchange = () => render(pick());
render(pick());
</script>
